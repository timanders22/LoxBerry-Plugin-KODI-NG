<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%" fx="35%" fy="35%">
      <stop offset="0%" stop-color="#7dc424" />
      <stop offset="65%" stop-color="#6dac20" />
      <stop offset="100%" stop-color="#568819" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Badge Ring -->
  <circle cx="256" cy="256" r="246" fill="url(#bg-grad)" />
  <circle cx="256" cy="256" r="232" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" />

  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Main Diamond / Kodi Media Symbol -->
    <g transform="translate(256, 175) rotate(45)">
      <!-- Outer Diamond Shell -->
      <rect x="-65" y="-65" width="130" height="130" rx="20" fill="#ffffff" />
      <!-- Inner Cutout -->
      <rect x="-48" y="-48" width="96" height="96" rx="12" fill="#6dac20" />
      <!-- Center Play Triangle -->
      <polygon points="-8,-16 16,0 -8,16" fill="#ffffff" transform="rotate(-45)" />
    </g>

    <!-- Flanking Left Symbol: TV / Display Screen -->
    <g transform="translate(126, 165)">
      <circle cx="0" cy="0" r="22" fill="#ffffff" />
      <rect x="-10" y="-8" width="20" height="13" rx="2" fill="#6dac20" />
      <path d="M -4 5 L 4 5 L 6 9 L -6 9 Z" fill="#6dac20" />
    </g>

    <!-- Flanking Right Symbol: Remote Control / Smart Media -->
    <g transform="translate(386, 165)">
      <circle cx="0" cy="0" r="22" fill="#ffffff" />
      <rect x="-7" y="-11" width="14" height="22" rx="4" fill="#6dac20" />
      <circle cx="0" cy="-6" r="2" fill="#ffffff" />
      <circle cx="-3" cy="-1" r="1.5" fill="#ffffff" />
      <circle cx="3" cy="-1" r="1.5" fill="#ffffff" />
      <circle cx="-3" cy="3" r="1.5" fill="#ffffff" />
      <circle cx="3" cy="3" r="1.5" fill="#ffffff" />
      <circle cx="0" cy="7" r="2" fill="#ffffff" />
    </g>

    <!-- Dashed Line -->
    <path d="M 150 345 L 362 345" stroke="#ffffff" stroke-width="4" stroke-dasharray="6 8" opacity="0.8" />
  </g>

  <!-- Typography -->
  <text x="256" y="388" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="900" font-size="29" letter-spacing="1">KODI</text>
  <text x="256" y="424" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="20" letter-spacing="3">LOXBERRY</text>
</svg>
