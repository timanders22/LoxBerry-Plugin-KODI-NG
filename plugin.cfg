[AUTHOR]
NAME=Christian Fenzl
EMAIL=christiantf@gmx.at

[SYSTEM]
INTERFACE=2.0
LB_MINIMUM=3.0
LB_MAXIMUM=false
ARCHITECTURE="raspberry"
CUSTOM_LOGLEVELS=true
REBOOT=true

[PLUGIN]
# V1.0.0 LoxBerry-4-Update: totes pipplware-Repo entfernt (apt-key existiert in
#        bookworm nicht mehr), Kodi aus Standard-Repo, config.txt-Pfad bookworm,
#        Callback-Addon auf Python 3 portiert (Kodi 19+), MQTT via LoxBerry
#        MQTT Gateway, SVG-Icon
VERSION=1.0.0
NAME=kodi
FOLDER=kodi
TITLE=Kodi

[AUTOUPDATE]
# Die frueheren RELEASECFG-URLs zeigten faelschlich auf das
# LoxberryBackup-Repository (Copy-Paste-Fehler) und wurden entfernt.
# Beide Adressen zeigen auf diese Fortfuehrung, nicht auf das Original.
# christianTFs Fassung 0.1.2 ist ein Entwurf von 2018 und laeuft auf
# aktuellen Systemen nicht mehr; zeigten die Adressen dorthin, wuerde
# LoxBerry diese Fassung dadurch ersetzen.
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Kodi/master/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Kodi/master/prerelease.cfg
