[AUTHOR]
# Diese beiden Felder sind die KENNUNG des Plugins, kein Urhebervermerk.
# LoxBerry bildet daraus zusammen mit [PLUGIN] NAME die Kennzahl, unter der
# es Installation und Updates fuehrt. Bis 1.0.0 stand hier der Autor der
# Originalfassung - mit seiner privaten Mailadresse -, waehrend RELEASECFG
# bereits auf dieses Repository zeigte. Die urheberrechtliche Nennung steht
# in NOTICE, im README und im Kopf der Oberflaeche.
NAME=Kodi NG LoxBerry Plugin Authors
EMAIL=kodi-ng-loxberry@users.noreply.github.com

[SYSTEM]
INTERFACE=2.0
LB_MINIMUM=3.0
LB_MAXIMUM=false
ARCHITECTURE=raspberry
CUSTOM_LOGLEVELS=true
REBOOT=true

[PLUGIN]
# V1.0.0 LoxBerry-4-Update: totes pipplware-Repo entfernt (apt-key existiert in
#        bookworm nicht mehr), Kodi aus Standard-Repo, config.txt-Pfad bookworm,
#        Callback-Addon auf Python 3 portiert (Kodi 19+), MQTT via LoxBerry
#        MQTT Gateway, SVG-Icon
VERSION=1.1.0
NAME=kodi_ng
FOLDER=kodi_ng
TITLE=Kodi NG

[AUTOUPDATE]
# Die frueheren RELEASECFG-URLs zeigten faelschlich auf das
# LoxberryBackup-Repository (Copy-Paste-Fehler) und wurden entfernt.
# Beide Adressen zeigen auf diese Fortfuehrung, nicht auf das Original.
# christianTFs Fassung 0.1.2 ist ein Entwurf von 2018 und laeuft auf
# aktuellen Systemen nicht mehr; zeigten die Adressen dorthin, wuerde
# LoxBerry diese Fassung dadurch ersetzen.
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-KODI-NG/master/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-KODI-NG/master/prerelease.cfg
