; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help page is not escaped on output.
;
; UP TO 1.1.9 K06 CARRIED THE GATEWAY V1 SENTENCE unconditionally. The
; interface distinguishes the two versions of the MQTT gateway; this help
; page is static HTML and cannot. An unconditional sentence here would have
; cancelled that distinction again. K06 therefore names BOTH cases and points
; at the tab that actually read the version.

[HILFE]
K01 = "Kodi NG"
K02 = "Installs <b>Kodi</b> directly on the LoxBerry and connects it to Loxone. State and events go to the LoxBerry MQTT gateway and, on request, additionally by UDP to the Miniserver. Kodi is controlled over JSON-RPC; the plugin creates ready-made templates for virtual inputs and outputs itself."
K03 = "How to proceed"
K04 = "<b>Kodi itself does not have to be installed separately.</b> It comes with this plugin: on installation LoxBerry reads the file <span class='sm-mono'>dpkg/apt</span> and fetches the package <span class='sm-mono'>kodi</span> from the standard Raspberry Pi OS source; the plugin then creates the user <span class='sm-mono'>kodi</span>, the system service and the permissions for the input devices. Whether that worked is answered on the <i>Test</i> tab by the row <i>Is Kodi installed at all?</i> — if it says no, reinstalling the plugin usually helps."
K04d = "<b>How do I get to Kodi at all?</b> Through the <b>screen attached to the LoxBerry</b>. Kodi runs as its own service on console <span class='sm-mono'>/dev/tty7</span> and outputs on HDMI — its interface appears on the connected TV or monitor. Operate it with a USB keyboard, a remote, or via HDMI-CEC with the TV's own remote. From a phone use the app <i>Kore</i> (Android) or <i>Kodi Remote</i> (iOS): enter the LoxBerry address and port 8080. <b>Kodi's settings menu, however, exists only on the screen</b> — neither the phone app nor a browser web interface can open it."
K04e = "<b>And what has to be configured there for this plugin? Nothing.</b> The plugin switches the remote control on itself during installation (<span class='sm-mono'>advancedsettings.xml</span>), installs the callback add-on itself, and its seven fields are set by the button <i>Apply add-on settings</i> on the <i>MQTT</i> tab. You only need Kodi's interface for your <b>media sources</b> — and if you want a browser interface: in Kodi under <i>Add-ons → Install from repository → Web interfaces → Kodi Web Interface - Chorus2</i>, then select it under <i>Settings → Services → Control → Web interface</i>."
K04c = "<b>After installation the service shows <i>stopped</i>, and that is correct.</b> The plugin switches autostart on but does not start Kodi immediately: the group permissions for audio, video and input devices and the GPU setting only take effect after a reboot — which is why LoxBerry asks for one. To see it running right away, start the service on the <i>Test</i> tab."
K04b = "<b>Settings:</b> enter the address and port of Kodi, start the service and switch on the autostart. If Kodi requires a user name and password, they belong in the same fields."
K05 = "<b>Settings:</b> switch on the <b>status sender</b>. It is off by default. Without it the plugin reports nothing on its own, and the virtual inputs from the template stay empty."
K06 = "<b>MQTT:</b> set the topic and press <i>Set add-on settings</i> to align the Kodi add-on with it. Whether a subscription then has to be entered in the gateway by hand depends on its version: with <b>V1</b> yes, with <b>V2</b> no. Which version runs here is stated on the <i>Loxone integration</i> tab — it reads it from the LoxBerry configuration."
K07 = "<b>Loxone integration:</b> create both templates and import them into Loxone Config."
K08 = "<b>Test:</b> go through the self-check. Every red row names the remedy; a grey dot means „could not be measured“ and is not a tick."
K09 = "Backing up and restoring settings"
K10 = "The <i>Settings</i> tab carries two buttons. The first downloads a text file, the second takes it back. This is meant for <b>moving house</b> to a second LoxBerry — so more than the configuration file is saved: also the autostart setting and the seven fields that live in the Kodi add-on and would otherwise have to be typed in with the remote control."
K11 = "<b>The file contains your credentials.</b> Treat it like a password. The codec licences are stored together with the serial number they were bought for; they are only restored on explicit request and only if the serial number matches — on a different Pi they are worthless."
K12 = "What changed compared with the previous version"
K13 = "Up to 1.1.9 this plugin had <b>no background service</b>. The topics <span class='sm-mono'>dienst</span>, <span class='sm-mono'>autostart</span> and <span class='sm-mono'>zeitstempel</span> were only published when somebody pressed the test button. In Loxone that looked like „Kodi is off“, not like „nobody is sending here“."
K14 = "Also new: the topic table now matches what is really being sent, the Kodi add-on can be configured from the interface, and every form carries a mark against foreign senders."
K15 = "If no events arrive"
K16 = "Is the <b>status sender</b> switched on? The Test tab says so in the row <i>Is the status sender sending?</i> and names the heartbeat."
K17 = "Is the callback add-on really <b>enabled</b> inside Kodi? Installed alone is not enough — and the row <i>Do the add-on settings match the plugin?</i> on the Test tab shows what is set there."
K18 = "Are the LoxBerry address and the <b>UDP port of the gateway</b> correct in the add-on? That port is not the MQTT port 1883."
K19 = "Does Kodi run as a user allowed to use the display? Without a display Kodi does not start, and then there are no events either."
K20 = "Control"
K21 = "The commands go to Kodi over JSON-RPC — the Miniserver talks to Kodi <b>directly</b> via <span class='sm-mono'>tcp://…:9090</span>, not through the LoxBerry. Kodi's web interface has to be switched on inside Kodi under <i>Services &rarr; Control</i>, otherwise Kodi accepts nothing."
