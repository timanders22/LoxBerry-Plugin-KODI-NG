; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help page is not escaped on output.
;
; UP TO 1.1.9 K06 CARRIED THE GATEWAY V1 SENTENCE unconditionally. The
; interface distinguishes the two versions of the MQTT gateway; this help
; page is static HTML and cannot. An unconditional sentence here would have
; cancelled that distinction again. K06 therefore names BOTH cases and points
; at the tab that actually read the version.

[HILFE]
K01 = "Kodi NG"
K02 = "Installs <b>Kodi</b> directly on the LoxBerry and connects it to Loxone. State and events go via MQTT to the LoxBerry gateway and, if wanted, additionally via UDP to the Miniserver. Since 1.2.22 Kodi is controlled via MQTT: Loxone sends commands to the plugin, which passes them on to Kodi via JSON-RPC; the plugin generates the template for the commands itself."
K03 = "How to proceed"
K04 = "<b>Kodi itself does not have to be installed separately.</b> It comes with this plugin: on installation LoxBerry reads the file <span class='sm-mono'>dpkg/apt</span> and fetches the package <span class='sm-mono'>kodi</span> from the standard Raspberry Pi OS source; the plugin then creates the user <span class='sm-mono'>kodi</span>, the system service and the permissions for the input devices. Whether that worked is answered on the <i>Test</i> tab by the row <i>Is Kodi installed at all?</i> — if it says no, reinstalling the plugin usually helps."
K04d = "<b>How do I get to Kodi at all?</b> Through the <b>screen attached to the LoxBerry</b>. Kodi runs as its own service and outputs on HDMI — its interface appears on the connected TV or monitor. Operate it with a USB keyboard, a remote, or via HDMI-CEC with the TV's own remote. From a phone use the app <i>Kore</i> (Android) or <i>Kodi Remote</i> (iOS) with the LoxBerry address and the port of Kodi's web interface (default 8080). <b>Kodi's settings menu only exists on the screen</b> — neither the phone app nor a web interface in the browser can open it."
K04e = "<b>And what has to be set there for this plugin?</b> On installation the plugin creates <span class='sm-mono'>advancedsettings.xml</span>: Kodi's web server, Zeroconf and remote control from other computers are switched on with it. The latter is only needed by the direct route <span class='sm-mono'>tcp://…:9090</span> of existing installations; at the same time it opens Kodi's EventServer (UDP 9777) without login for the home network – Kodi cannot separate the two. Since 1.2.22 it can be switched off on the tab <i>Integration into Loxone</i>. The plugin installs the callback add-on itself; the four fields that belong to the plugin are set by the button <i>Set add-on settings</i> on the <i>MQTT</i> tab. <b>Not measured</b> is whether Kodi 21 asks for a password for its web server: if it answers with 401, the Test tab says so, and user and password then belong on the Settings tab. A web interface for the browser is installed in Kodi under <i>Add-ons → Install from repository → Web interfaces</i>."
K04f = "<b>Prerequisite: a graphics driver.</b> Kodi needs a display output on the LoxBerry (<span class='sm-mono'>/dev/dri</span>). On a LoxBerry without a display driver — measured on a DietPi installation — Kodi does not start. The <i>Test</i> tab says whether it is there; if it is missing, a notice at the top of the page names the line that belongs in <span class='sm-mono'>config.txt</span>."
K04c = "<b>After installation the service shows <i>stopped</i>, and that is correct.</b> The plugin switches autostart on but does not start Kodi immediately: the group permissions for audio, video and input devices only take effect after a reboot — which is why LoxBerry asks for one. To see it running right away, start the service on the <i>Settings</i> tab."
K04b = "<b>Settings:</b> enter the address and port of Kodi, start the service and switch on the autostart. If Kodi requires a user name and password, they belong in the same fields."
K05 = "<b>MQTT:</b> check the <b>status sender</b>. On a new installation it is on by default as soon as the settings have been saved once; after an update the previous value applies. Without it the plugin reports nothing on its own, and the virtual inputs stay empty. For commands from Loxone tick <i>Accept commands via MQTT</i> on the same tab (off by default)."
K06 = "<b>MQTT:</b> set the topic and press <i>Set add-on settings</i> to align the Kodi add-on with it. Whether a subscription then has to be entered in the gateway by hand depends on its version: with <b>V1</b> yes, with <b>V2</b> no. Which version runs here is stated on the <i>Loxone integration</i> tab — it reads it from the LoxBerry configuration."
K07 = "<b>Integration into Loxone:</b> go through steps 1 to 3 – values via the MQTT gateway, virtual inputs after the name table, commands via MQTT with the MQTT commands template – and rebuild the three block lists (state and failure detection, remote control, playback and automation), each with a picture and step-by-step instructions. The direct route <span class='sm-mono'>tcp://…:9090</span> is folded away for existing installations."
K08 = "<b>Test:</b> go through the self-check. Every red row names the remedy; a grey dot means „could not be measured“ and is not a tick."
K09 = "Backing up and restoring settings"
K10 = "The <i>Settings</i> tab carries two buttons. The first downloads a text file, the second takes it back. This is meant for <b>moving house</b> to a second LoxBerry — so more than the configuration file is saved: also the autostart setting and the fields that live in the Kodi add-on and would otherwise have to be typed in with the remote control."
K11 = "<b>The file contains your credentials.</b> Treat it like a password. The codec licences are stored together with the serial number they were bought for; they are only restored on explicit request and only if the serial number matches — on a different Pi they are worthless."
K12 = "What the status sender reports"
K13 = "<b>A sign of life every minute:</b> <span class='sm-mono'>status/zaehler</span> (0 to 999, wraps around) and <span class='sm-mono'>status/ts</span>, for existing installations still <span class='sm-mono'>zeitstempel</span> and <span class='sm-mono'>herzschlag</span>, are never retained — if they stop changing in Loxone, the sender or the route to the Miniserver has failed. <span class='sm-mono'>status/ok</span> is 1 when the last run could really query the Kodi service, otherwise 0; this value is never retained either."
K14 = "<b>At the configured interval, the state:</b> <span class='sm-mono'>dienst</span> and <span class='sm-mono'>autostart</span>, with the JSON-RPC query switched on also <span class='sm-mono'>erreichbar</span>, <span class='sm-mono'>wiedergabe</span> and <span class='sm-mono'>titel</span>. Kodi's states stay in the broker so that Loxone has the current state straight after a restart; <span class='sm-mono'>erreichbar</span> does not — whether Kodi answers is determined by the sender itself, and after its failure an old value would be left standing. If Kodi cannot be reached, <span class='sm-mono'>wiedergabe</span> and <span class='sm-mono'>titel</span> go out as a dash without being retained; the broker keeps the last state Kodi reported. The test event on the Test tab and the addon's <span class='sm-mono'>event</span> topic are never retained — an event is not a state. When the status sender is switched off or the topic is changed, the plugin clears its topics under the previous prefix; the topic in the addon and the subscription in the gateway do not follow on their own. Which topic is retained is shown in the topic table on the MQTT tab."
K15 = "If no events arrive"
K16 = "Is the <b>status sender</b> switched on (MQTT tab)? The Test tab says in the row <i>Is the status sender sending?</i> when the last complete run was and how many lines it handed over. Handed over does not mean arrived: whether the values are in the broker is shown by the MQTT Finder. On the house LoxBerry on 17.09.2026 they only arrived after several minutes because the gateway's UDP input was two megabytes behind."
K17 = "Is the callback add-on really <b>enabled</b> inside Kodi? Installed alone is not enough — and the row <i>Do the add-on settings match the plugin?</i> on the Test tab shows what is set there."
K18 = "Are the LoxBerry address and the <b>UDP port of the gateway</b> correct in the add-on? That port is not the MQTT port 1883."
K19 = "Can Kodi produce a picture on this device at all? Without a graphics driver Kodi does not start — measured on 17.09.2026 on a LoxBerry running DietPi: there was no <span class='sm-mono'>/dev/dri</span>, Kodi aborted with <i>unable to init windowing system</i> and stayed down after three attempts. The Test tab shows this in the row <i>Can Kodi produce a picture?</i>; on a Raspberry Pi <span class='sm-mono'>dtoverlay=vc4-kms-v3d</span> is then missing from <span class='sm-mono'>config.txt</span>. The plugin does not add it by itself."
K20 = "Control"
K21 = "Since 1.2.22 the commands go via MQTT: Loxone sends <span class='sm-mono'>publish kodi/befehl/…</span> to the UDP input of the MQTT gateway, the plugin's command bridge passes each one to Kodi via JSON-RPC over HTTP and acknowledges it. For this tick <i>Accept commands via MQTT</i> on the MQTT tab; <i>Kodi: quit</i> also needs <i>Allow intervening commands via MQTT</i>. Anyone on the home network can send commands via the gateway's UDP input – that is why both ticks are off by default. The previous route – the Miniserver talks to Kodi <b>directly</b> via <span class='sm-mono'>tcp://…:9090</span> – stays for existing installations; it needs Kodi's remote control from the home network (<span class='sm-mono'>esallinterfaces</span>), which also opens the EventServer (UDP 9777) without login. Whoever has switched over turns it off on the Integration tab; it takes effect after Kodi restarts."
