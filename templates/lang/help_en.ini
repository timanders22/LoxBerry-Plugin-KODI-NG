; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "Kodi NG"
K02 = "Installs <b>Kodi</b> directly on the LoxBerry and connects it to Loxone. Events — start, stop, pause, track change, screensaver — go to the Miniserver via MQTT and, if you wish, additionally via UDP. Kodi is controlled through JSON-RPC; a ready-made template for virtual outputs is included."
K03 = "How to proceed"
K04 = "<b>Settings:</b> have Kodi installed and start the service."
K05 = "In Kodi, switch on the supplied <b>callback add-on</b> and enter the address of the LoxBerry and the UDP port of the MQTT gateway there."
K06 = "<b>MQTT:</b> enter the subscription in the gateway. Without that entry nothing arrives at the Miniserver."
K07 = "<b>Loxone integration:</b> paste the template <span class='sm-mono'>VO_Kodi_V1.xml</span> into Loxone Config."
K08 = "What has changed since the previous version"
K09 = "The installation was <b>broken</b>: the pipplware repository for Debian stretch no longer exists, and the call to <span class='sm-mono'>apt-key</span> was removed in Bookworm. Kodi now comes from the standard Raspberry Pi OS repository."
K10 = "The callback add-on was <b>Python 2</b> and had not run on any current Kodi since Kodi 19 „Matrix“ (2021). It has been ported to Python 3 and can now also do MQTT — retained, under topics of the form <span class='sm-mono'>kodi/&lt;event&gt;</span>."
K11 = "If no events arrive"
K12 = "Is the callback add-on actually <b>enabled</b> in Kodi? Installing it is not enough."
K13 = "Are the LoxBerry address and the <b>UDP port of the gateway</b> correct in the add-on? That port is not the MQTT port 1883."
K14 = "Is Kodi running as a user allowed to use the display? Without a display Kodi does not start, and then there are no events either."
K15 = "Control"
K16 = "The commands go to Kodi through JSON-RPC. Kodi's web interface has to be switched on for that under <i>Services → Control</i>, otherwise Kodi accepts nothing."
