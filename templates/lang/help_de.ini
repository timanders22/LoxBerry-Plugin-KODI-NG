; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.
;
; HIER STAND BIS 1.1.9 IN K06 DER SATZ ZUR GATEWAY-FASSUNG V1 - unbedingt und
; ohne Einschraenkung. Die Oberflaeche unterscheidet die beiden Fassungen des
; MQTT-Gateways; diese Hilfeseite ist statisches HTML und kann es nicht. Ein
; unbedingter Satz an dieser Stelle haette die Unterscheidung wieder
; aufgehoben. Deshalb nennt K06 jetzt BEIDE Faelle und verweist fuer die
; Entscheidung auf den Reiter, der die Fassung wirklich gelesen hat.

[HILFE]
K01 = "Kodi NG"
K02 = "Installiert <b>Kodi</b> unmittelbar auf dem LoxBerry und verbindet es mit Loxone. Zustand und Ereignisse gehen per MQTT an das LoxBerry-Gateway und auf Wunsch zusätzlich per UDP an den Miniserver. Gesteuert wird Kodi über JSON-RPC; fertige Vorlagen für virtuelle Ein- und Ausgänge erzeugt das Plugin selbst."
K03 = "So gehen Sie vor"
K04 = "<b>Kodi selbst muss nicht getrennt installiert werden.</b> Es kommt mit diesem Plugin: LoxBerry liest beim Einspielen die Datei <span class='sm-mono'>dpkg/apt</span> und holt das Paket <span class='sm-mono'>kodi</span> aus der Standardquelle von Raspberry Pi OS; danach legt das Plugin den Benutzer <span class='sm-mono'>kodi</span>, den Systemdienst und die Rechte für die Eingabegeräte an. Ob das geklappt hat, sagt im Reiter <i>Test</i> die Zeile <i>Ist Kodi überhaupt installiert?</i> — steht sie auf Nein, hilft meist ein erneutes Installieren des Plugins."
K04d = "<b>Wie komme ich überhaupt an Kodi?</b> Über den <b>Bildschirm am LoxBerry</b>. Kodi läuft als eigener Dienst auf der Konsole <span class='sm-mono'>/dev/tty7</span> und gibt auf dem HDMI-Ausgang aus — seine Oberfläche erscheint also auf dem angeschlossenen Fernseher oder Monitor. Bedient wird sie mit einer USB-Tastatur, einer Fernbedienung oder über HDMI-CEC mit der Fernbedienung des Fernsehers. Vom Handy aus geht es mit der App <i>Kore</i> (Android) beziehungsweise <i>Kodi Remote</i> (iOS): LoxBerry-Adresse und Port 8080 eintragen, fertig. <b>Kodis Einstellungsmenü gibt es aber nur auf dem Bildschirm</b> — weder die Handy-App noch eine Weboberfläche im Browser können es öffnen."
K04e = "<b>Und was muss man dort für dieses Plugin einstellen? Nichts.</b> Die Fernsteuerung schaltet das Plugin beim Einspielen selbst ein (<span class='sm-mono'>advancedsettings.xml</span>), das Callback-Addon spielt es selbst ein, und dessen sieben Felder setzt der Knopf <i>Addon-Einstellungen setzen</i> im Reiter <i>MQTT</i>. An Kodis Oberfläche gehen Sie nur für Ihre <b>Medienquellen</b> — und wenn Sie eine Weboberfläche für den Browser wollen: in Kodi unter <i>Add-ons → Aus Repository installieren → Web-Interfaces → Kodi Web Interface - Chorus2</i>, danach unter <i>Einstellungen → Dienste → Steuerung → Weboberfläche</i> auswählen."
K04c = "<b>Nach dem Einspielen steht der Dienst auf <i>gestoppt</i>, und das ist richtig so.</b> Das Plugin schaltet den Autostart ein, startet Kodi aber nicht sofort: die Gruppenrechte für Ton, Bild und Eingabegeräte und die GPU-Einstellung greifen erst nach einem Neustart — deshalb fragt LoxBerry danach. Wer sofort sehen will, ob es läuft, startet den Dienst im Reiter <i>Test</i>."
K04b = "<b>Einstellungen:</b> Adresse und Port von Kodi eintragen, den Dienst starten und den Autostart einschalten. Verlangt Kodi Benutzer und Passwort, gehören sie in dieselben Felder."
K05 = "<b>Einstellungen:</b> den <b>Statussender</b> einschalten. Er ist ab Werk aus. Ohne ihn meldet das Plugin von sich aus nichts, und die virtuellen Eingänge aus der Vorlage bleiben leer."
K06 = "<b>MQTT:</b> das Thema festlegen und mit dem Knopf <i>Addon-Einstellungen setzen</i> das Kodi-Addon darauf ausrichten. Ob im Gateway anschließend ein Abo von Hand einzutragen ist, hängt von dessen Fassung ab: bei <b>V1</b> ja, bei <b>V2</b> nein. Welche Fassung hier läuft, sagt der Reiter <i>Einbindung in Loxone</i> — er liest sie aus der Konfiguration des LoxBerry."
K07 = "<b>Einbindung in Loxone:</b> die beiden Vorlagen erzeugen und in Loxone Config einfügen."
K08 = "<b>Test:</b> die Selbstprüfung durchsehen. Jede rote Zeile nennt die Abhilfe mit; ein grauer Punkt heißt „konnte nicht gemessen werden“ und ist kein Haken."
K09 = "Einstellungen sichern und zurückspielen"
K10 = "Im Reiter <i>Einstellungen</i> stehen zwei Knöpfe. Der erste lädt eine Textdatei herunter, der zweite nimmt sie wieder entgegen. Gedacht ist das für den <b>Umzug</b> auf einen zweiten LoxBerry — gesichert wird deshalb mehr als die Konfigurationsdatei: auch der Autostart und die sieben Felder, die im Kodi-Addon stehen und die man sonst über die Fernbedienung abtippen müsste."
K11 = "<b>Die Datei enthält Ihre Zugangsdaten.</b> Behandeln Sie sie wie ein Passwort. Die Codec-Lizenzen stehen mit der Seriennummer darin, für die sie gekauft wurden; zurückgespielt werden sie nur auf ausdrücklichen Wunsch und nur, wenn die Seriennummer übereinstimmt — auf einem anderen Pi sind sie wertlos."
K12 = "Was sich gegenüber der Vorfassung geändert hat"
K13 = "Bis 1.1.9 hatte dieses Plugin <b>keinen Hintergrunddienst</b>. Die Themen <span class='sm-mono'>dienst</span>, <span class='sm-mono'>autostart</span> und <span class='sm-mono'>zeitstempel</span> wurden nur veröffentlicht, wenn jemand im Reiter Test den Testknopf drückte. In Loxone sah das aus wie „Kodi ist aus“, nicht wie „hier sendet niemand“."
K14 = "Ebenfalls neu: die Themen-Tabelle stimmt jetzt mit dem überein, was wirklich gesendet wird, das Kodi-Addon lässt sich aus der Oberfläche einrichten, und jedes Formular trägt ein Merkmal gegen fremde Absender."
K15 = "Wenn keine Ereignisse ankommen"
K16 = "Ist der <b>Statussender</b> eingeschaltet? Der Reiter Test sagt es in der Zeile <i>Sendet der Statussender?</i> und nennt den Herzschlag."
K17 = "Ist das Callback-Addon in Kodi wirklich <b>aktiviert</b>? Installiert allein genügt nicht — und die Zeile <i>Stimmen die Addon-Einstellungen mit dem Plugin überein?</i> im Reiter Test zeigt, was dort steht."
K18 = "Stimmen im Addon die Adresse des LoxBerry und der <b>UDP-Port des Gateways</b>? Der Port ist nicht der MQTT-Port 1883."
K19 = "Läuft Kodi als Benutzer, der auf den Bildschirm darf? Ohne Anzeige startet Kodi nicht, und dann gibt es auch keine Ereignisse."
K20 = "Steuerung"
K21 = "Die Befehle gehen per JSON-RPC an Kodi — der Miniserver spricht dabei <b>unmittelbar</b> mit Kodi über <span class='sm-mono'>tcp://…:9090</span>, nicht über den LoxBerry. Kodis Weboberfläche muss dafür in Kodi unter <i>Dienste &rarr; Steuerung</i> eingeschaltet sein, sonst nimmt Kodi nichts entgegen."
