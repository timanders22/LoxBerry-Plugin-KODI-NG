; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Kodi NG"
K02 = "Installiert <b>Kodi</b> unmittelbar auf dem LoxBerry und verbindet es mit Loxone. Ereignisse — Start, Stopp, Pause, Titelwechsel, Bildschirmschoner — gehen per MQTT und auf Wunsch zusätzlich per UDP an den Miniserver. Gesteuert wird Kodi über JSON-RPC; eine fertige Vorlage für virtuelle Ausgänge liegt bei."
K03 = "So gehen Sie vor"
K04 = "<b>Einstellungen:</b> Kodi installieren lassen und den Dienst starten."
K05 = "In Kodi das mitgelieferte <b>Callback-Addon</b> einschalten und dort die Adresse des LoxBerry sowie den UDP-Port des MQTT-Gateways eintragen."
K06 = "<b>MQTT:</b> das Abo im Gateway eintragen. Ohne diesen Eintrag kommt am Miniserver nichts an."
K07 = "<b>Einbindung in Loxone:</b> die Vorlage <span class='sm-mono'>VO_Kodi_V1.xml</span> in Loxone Config einfügen."
K08 = "Was sich gegenüber der Vorfassung geändert hat"
K09 = "Die Installation war <b>kaputt</b>: das pipplware-Repository für Debian stretch gibt es nicht mehr, und der Aufruf von <span class='sm-mono'>apt-key</span> ist in Bookworm entfallen. Kodi kommt jetzt aus dem Standard-Repository von Raspberry Pi OS."
K10 = "Das Callback-Addon war <b>Python 2</b> und lief seit Kodi 19 „Matrix“ (2021) auf keinem aktuellen Kodi mehr. Es ist auf Python 3 portiert und kann jetzt auch MQTT — retained, unter Themen der Form <span class='sm-mono'>kodi/&lt;ereignis&gt;</span>."
K11 = "Wenn keine Ereignisse ankommen"
K12 = "Ist das Callback-Addon in Kodi wirklich <b>aktiviert</b>? Installiert allein genügt nicht."
K13 = "Stimmen im Addon die Adresse des LoxBerry und der <b>UDP-Port des Gateways</b>? Der Port ist nicht der MQTT-Port 1883."
K14 = "Läuft Kodi als Benutzer, der auf den Bildschirm darf? Ohne Anzeige startet Kodi nicht, und dann gibt es auch keine Ereignisse."
K15 = "Steuerung"
K16 = "Die Befehle gehen per JSON-RPC an Kodi. Dessen Weboberfläche muss dafür in Kodi unter <i>Dienste → Steuerung</i> eingeschaltet sein, sonst nimmt Kodi nichts entgegen."
