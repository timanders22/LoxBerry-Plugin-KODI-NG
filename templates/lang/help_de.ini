; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.
;
; HIER STAND BIS 1.1.9 IN K06 DER SATZ ZUR GATEWAY-FASSUNG V1 - unbedingt und
; ohne Einschraenkung. Die Oberflaeche unterscheidet die beiden Fassungen des
; MQTT-Gateways; diese Hilfeseite ist statisches HTML und kann es nicht. Ein
; unbedingter Satz an dieser Stelle haette die Unterscheidung wieder
; aufgehoben. Deshalb nennt K06 jetzt BEIDE Faelle und verweist fuer die
; Entscheidung auf den Reiter, der die Fassung wirklich gelesen hat.

[HILFE]
K01 = "Kodi NG"
K02 = "Installiert <b>Kodi</b> unmittelbar auf dem LoxBerry und verbindet es mit Loxone. Zustand und Ereignisse gehen per MQTT an das LoxBerry-Gateway und auf Wunsch zusätzlich per UDP an den Miniserver. Gesteuert wird Kodi über JSON-RPC; fertige Vorlagen für virtuelle Ein- und Ausgänge erzeugt das Plugin selbst."
K03 = "So gehen Sie vor"
K04 = "<b>Kodi selbst muss nicht getrennt installiert werden.</b> Es kommt mit diesem Plugin: LoxBerry liest beim Einspielen die Datei <span class='sm-mono'>dpkg/apt</span> und holt das Paket <span class='sm-mono'>kodi</span> aus der Standardquelle von Raspberry Pi OS; danach legt das Plugin den Benutzer <span class='sm-mono'>kodi</span>, den Systemdienst und die Rechte für die Eingabegeräte an. Ob das geklappt hat, sagt im Reiter <i>Test</i> die Zeile <i>Ist Kodi überhaupt installiert?</i> — steht sie auf Nein, hilft meist ein erneutes Installieren des Plugins."
K04d = "<b>Wie komme ich überhaupt an Kodi?</b> Über den <b>Bildschirm am LoxBerry</b>. Kodi läuft als eigener Dienst und gibt auf dem HDMI-Ausgang aus — seine Oberfläche erscheint also auf dem angeschlossenen Fernseher oder Monitor. Bedient wird sie mit einer USB-Tastatur, einer Fernbedienung oder über HDMI-CEC mit der Fernbedienung des Fernsehers. Vom Handy aus geht es mit der App <i>Kore</i> (Android) beziehungsweise <i>Kodi Remote</i> (iOS) über die LoxBerry-Adresse und den Port der Kodi-Weboberfläche (Vorgabe 8080). <b>Kodis Einstellungsmenü gibt es aber nur auf dem Bildschirm</b> — weder die Handy-App noch eine Weboberfläche im Browser können es öffnen."
K04e = "<b>Und was muss man dort für dieses Plugin einstellen?</b> Das Plugin legt beim Einspielen <span class='sm-mono'>advancedsettings.xml</span> an: Kodis Webserver, Zeroconf und die Fernsteuerung von anderen Rechnern sind damit eingeschaltet. Letztere braucht die Steuerung aus Loxone (<span class='sm-mono'>tcp://…:9090</span>); sie öffnet zugleich Kodis EventServer (UDP 9777) ohne Anmeldung für das Heimnetz — in Kodi lässt sich das nicht trennen. Das Callback-Addon spielt das Plugin selbst ein; die vier Felder, die dem Plugin gehören, setzt der Knopf <i>Addon-Einstellungen setzen</i> im Reiter <i>MQTT</i>. <b>Nicht gemessen</b> ist, ob Kodi 21 für seinen Webserver ein Passwort verlangt: antwortet es mit 401, sagt der Reiter Test das, und Benutzer und Passwort gehören dann in den Reiter Einstellungen. Eine Weboberfläche für den Browser installiert man in Kodi unter <i>Add-ons → Aus Repository installieren → Web-Interfaces</i>."
K04f = "<b>Voraussetzung: ein Grafiktreiber.</b> Kodi braucht auf dem LoxBerry eine Bildausgabe (<span class='sm-mono'>/dev/dri</span>). Auf einem LoxBerry ohne Bildschirmtreiber — gemessen an einer DietPi-Installation — startet Kodi nicht. Ob sie da ist, sagt der Reiter <i>Test</i>; fehlt sie, erscheint oben auf der Seite ein Hinweis mit der Zeile, die in die <span class='sm-mono'>config.txt</span> gehört."
K04c = "<b>Nach dem Einspielen steht der Dienst auf <i>gestoppt</i>, und das ist richtig so.</b> Das Plugin schaltet den Autostart ein, startet Kodi aber nicht sofort: die Gruppenrechte für Ton, Bild und Eingabegeräte greifen erst nach einem Neustart — deshalb fragt LoxBerry danach. Wer sofort sehen will, ob es läuft, startet den Dienst im Reiter <i>Einstellungen</i>."
K04b = "<b>Einstellungen:</b> Adresse und Port von Kodi eintragen, den Dienst starten und den Autostart einschalten. Verlangt Kodi Benutzer und Passwort, gehören sie in dieselben Felder."
K05 = "<b>MQTT:</b> den <b>Statussender</b> einschalten. Er ist ab Werk aus. Ohne ihn meldet das Plugin von sich aus nichts, und die virtuellen Eingänge aus der Vorlage bleiben leer."
K06 = "<b>MQTT:</b> das Thema festlegen und mit dem Knopf <i>Addon-Einstellungen setzen</i> das Kodi-Addon darauf ausrichten. Ob im Gateway anschließend ein Abo von Hand einzutragen ist, hängt von dessen Fassung ab: bei <b>V1</b> ja, bei <b>V2</b> nein. Welche Fassung hier läuft, sagt der Reiter <i>Einbindung in Loxone</i> — er liest sie aus der Konfiguration des LoxBerry."
K07 = "<b>Einbindung in Loxone:</b> die sieben Schritte durchgehen, die beiden Vorlagen erzeugen und in Loxone Config einfügen, und die Ausfallerkennung nach der Baustein-Liste anlegen."
K08 = "<b>Test:</b> die Selbstprüfung durchsehen. Jede rote Zeile nennt die Abhilfe mit; ein grauer Punkt heißt „konnte nicht gemessen werden“ und ist kein Haken."
K09 = "Einstellungen sichern und zurückspielen"
K10 = "Im Reiter <i>Einstellungen</i> stehen zwei Knöpfe. Der erste lädt eine Textdatei herunter, der zweite nimmt sie wieder entgegen. Gedacht ist das für den <b>Umzug</b> auf einen zweiten LoxBerry — gesichert wird deshalb mehr als die Konfigurationsdatei: auch der Autostart und die Felder, die im Kodi-Addon stehen und die man sonst über die Fernbedienung abtippen müsste."
K11 = "<b>Die Datei enthält Ihre Zugangsdaten.</b> Behandeln Sie sie wie ein Passwort. Die Codec-Lizenzen stehen mit der Seriennummer darin, für die sie gekauft wurden; zurückgespielt werden sie nur auf ausdrücklichen Wunsch und nur, wenn die Seriennummer übereinstimmt — auf einem anderen Pi sind sie wertlos."
K12 = "Was der Statussender meldet"
K13 = "<b>Jede Minute ein Lebenszeichen:</b> <span class='sm-mono'>zeitstempel</span> und <span class='sm-mono'>herzschlag</span> gehen nie zurückbehalten hinaus — bleiben sie in Loxone stehen, ist der Sender oder der Weg zum Miniserver ausgefallen. <span class='sm-mono'>status/ok</span> ist 1, wenn der letzte Lauf den Kodi-Dienst wirklich befragen konnte, sonst 0; dieser Wert bleibt im Broker stehen."
K14 = "<b>Im eingestellten Abstand der Zustand:</b> <span class='sm-mono'>dienst</span> und <span class='sm-mono'>autostart</span>, mit eingeschalteter JSON-RPC-Abfrage auch <span class='sm-mono'>erreichbar</span>, <span class='sm-mono'>wiedergabe</span> und <span class='sm-mono'>titel</span> — diese Zustände bleiben im Broker stehen, damit Loxone nach einem Neustart sofort den Stand hat. Welches Thema zurückbehalten wird, steht in der Themen-Tabelle im Reiter MQTT."
K15 = "Wenn keine Ereignisse ankommen"
K16 = "Ist der <b>Statussender</b> eingeschaltet (Reiter MQTT)? Der Reiter Test sagt in der Zeile <i>Sendet der Statussender?</i>, wann der letzte vollständige Lauf war und wie viele Zeilen er übergeben hat. Übergeben heißt noch nicht angekommen: ob die Werte im Broker stehen, zeigt der MQTT Finder. Am LoxBerry des Hauses kamen sie am 17.09.2026 erst nach mehreren Minuten an, weil der UDP-Eingang des Gateways zwei Megabyte hinterherhing."
K17 = "Ist das Callback-Addon in Kodi wirklich <b>aktiviert</b>? Installiert allein genügt nicht — und die Zeile <i>Stimmen die Addon-Einstellungen mit dem Plugin überein?</i> im Reiter Test zeigt, was dort steht."
K18 = "Stimmen im Addon die Adresse des LoxBerry und der <b>UDP-Port des Gateways</b>? Der Port ist nicht der MQTT-Port 1883."
K19 = "Kann Kodi auf diesem Gerät überhaupt ein Bild erzeugen? Ohne Grafiktreiber startet Kodi nicht — gemessen am 17.09.2026 an einem LoxBerry auf DietPi: es gab kein <span class='sm-mono'>/dev/dri</span>, Kodi brach mit <i>unable to init windowing system</i> ab und blieb nach drei Versuchen stehen. Der Reiter Test zeigt das in der Zeile <i>Kann Kodi ein Bild erzeugen?</i>; auf einem Raspberry Pi fehlt dann <span class='sm-mono'>dtoverlay=vc4-kms-v3d</span> in der <span class='sm-mono'>config.txt</span>. Das Plugin trägt das nicht selbst ein."
K20 = "Steuerung"
K21 = "Die Befehle gehen per JSON-RPC an Kodi — der Miniserver spricht dabei <b>unmittelbar</b> mit Kodi über <span class='sm-mono'>tcp://…:9090</span>, nicht über den LoxBerry. Dafür muss in Kodi die Fernsteuerung von Anwendungen auf anderen Rechnern erlaubt sein; das Plugin schaltet sie beim Einspielen über <span class='sm-mono'>advancedsettings.xml</span> ein. Ohne sie lauscht Kodi auf 9090 nur für den LoxBerry selbst (Kodi-21-Quelltext, <span class='sm-mono'>NetworkServices.cpp</span>)."
