[LOX]
H = "How values and commands travel between Kodi and the Miniserver"
SCHRITT1 = "<b>MQTT is the standard route.</b> The plugin hands its values to the UDP input of the MQTT gateway, and the gateway forwards them to the Miniserver. The MQTT gateway is part of LoxBerry — it is in the main menu under <i>Services → MQTT Gateway</i>, no plugin has to be installed for it. Under <i>General</i> the UDP input must be switched on (default port 11884). That port currently is %s."
NICHT_GESETZT = "not set"
SCHRITT2 = "Open the <i>MQTT finder</i> in the gateway and expand the branch %s. Whatever Kodi and the plugin report appears there. To try it out, press <i>Send test event to MQTT</i> on the <i>Test</i> tab."
ABO_PFLICHT = "<b>Without this entry nothing arrives at the Miniserver.</b> This is by far the most common cause of failure."
ABO_V2 = "<b>MQTT Gateway V2 discovers the topic group by itself</b> — nothing has to be entered. The group appears in <i>Subscriptions</i>; tick the datapoints you want there. If it does not appear, nothing has been published yet: then first check on the Test tab whether anything is being sent at all."
SCHRITT3_V1 = "<b>gateway V1:</b> Enter the subscription under <i>Subscriptions</i> in the gateway and assign the topics to the Miniserver; they appear there as virtual inputs. No virtual output is needed for this."
SCHRITT3_V2 = "<b>gateway V2:</b> Tick the datapoints you want in <i>Subscriptions</i>; the gateway offers them to the Miniserver as virtual inputs. Nothing is entered by hand."
H_THEMEN = "Topics"
THEMEN_HINWEIS = "This table is the manual, and the plugin measures it itself — the rows <i>topic list</i>, <i>sign of life</i> and <i>name table</i> on the Test tab hold it against the sending code. The column <i>Name in the gateway</i> is the title of the virtual input in Loxone Config. The column <i>retained</i> says whether the value stays in the broker: Kodi's states yes; the sign of life and whatever the sender determines about itself (<span class='sm-mono'>status/ok</span>, <span class='sm-mono'>erreichbar</span>) never."
TH_THEMA = "Topic"
TH_BEDEUTUNG = "Meaning"
TH_WERTE = "Values"
TH_QUELLE = "sender"
Q_PLUGIN = "Plugin (cron)"
Q_ADDON = "Kodi add-on"
TEXTTHEMEN = "Text topics arrive as a virtual text input, named as in the column <i>Name in the gateway</i>. The Kodi add-on carries its own topic, shown below; by default it is the same one."
SENDER_AUS = "<b>The status sender is switched off.</b> The plugin's %d topics are therefore not sent, and the virtual inputs stay empty. Switch it on on the MQTT tab."
K_VORLAGE_VO = "Create template for the control commands"
STEUERN_TEXT = "The other way round — Loxone controlling Kodi — goes through Kodi's TCP interface. The Miniserver talks to Kodi <b>directly</b>, not through the LoxBerry; the plugin's folder name appears in no Loxone address. A virtual output with this address is enough:"
VORLAGE_HINWEIS = "The button produces exactly this output with all %d commands and the address shown above. The file <span class='sm-mono'>data/VO_Kodi_V1.xml</span> that used to ship alongside is <b>gone</b> since 1.2.0: it was a second copy of the same content, it had fallen behind the generator, and it carried the placeholder <span class='sm-mono'>loxberry</span> instead of your address."
S1 = "Step 1: Values via the MQTT gateway"
S2 = "Step 2: Create virtual inputs"
S3 = "Step 3: Commands via MQTT"
S3_TEXT = "The 26 commands go as <i>publish</i> to the UDP input of the MQTT gateway; the plugin's command bridge subscribes to %s and passes each command on to Kodi. In the sample project they hang on the virtual output “LoxBerry MQTT-Gateway”."
S4 = "Existing installations and third-party systems: commands directly to Kodi (TCP 9090)"
S5 = "Step 4: Failure detection"
S5_TEXT = "A virtual input keeps its last value when nothing arrives any more — the app then looks normal. Three topics exist against that: %s counts up by one every minute (0 to 999, wraps around) and %s carries the time in Unix seconds; both are <b>never</b> retained — if the counter stops, the status sender or the route to the Miniserver has failed (sample project: analog value validation with Max 999 and 300 s). %s is 1 when the last run really measured and 0 when the helper was silent — this value is never retained either. The earlier topics <span class='sm-mono'>zeitstempel</span> and <span class='sm-mono'>herzschlag</span> keep going out for existing installations."
S6 = "Step 5: Three complete block lists to rebuild"
S7 = "Step 6: Cross-check"
S7_TEXT = "In the MQTT gateway, look under <i>Incoming overview</i> or in the MQTT Finder whether anything arrives under %s. Then look at the input %s in Loxone Config: it must change every minute. <b>Only then</b> wire up the blocks — whoever starts wiring on a silent input ends up looking for the fault in the logic instead of the connection. If nothing arrives at the gateway, first read the row <i>Is the status sender sending?</i> on the Test tab."
TH_RETAIN = "retained"
ADRESSE_PRUEFEN = "The address is a suggestion: it comes from the configuration or from the address you are viewing this page under. Please check that the Miniserver reaches Kodi under this name."
BILD_ALT = "Plugin blocks in Loxone Config – page “%s”"
BILD_UNTERSCHRIFT = "Page “%s” in the LoxBerry plugins sample project. Config shortens long block names – see the table for the full names."
MUSTERPROJEKT = "The complete project file with all plugin pages and templates: <a href='https://github.com/timanders22/LoxBerry-Plugins-Musterprojekt' target='_blank' rel='noopener'>LoxBerry plugins sample project</a>"
BL_ZUSTAND = "State and messages"
BL_FERN = "Remote control"
BL_WIEDERGABE = "Playback and automation"
S0 = "The sample project fetches values via MQTT and sends commands via MQTT to the plugin. The direct route tcp://…:9090 is below for existing installations and third-party systems."
S1_SENDER = "Switch on the <b>status sender</b> on the MQTT tab – on a new installation it is on by default as soon as the settings have been saved once; an update does not change the saved value. Without it there is no sign of life, and the inputs of the sample project stay empty."
S1_V2_LISTE = "<b>Gateway V2:</b> tick these data points under <i>Subscriptions</i>; for “tick + Noncached” also the box <i>Noncached</i> – the value comes again with the same content and must still get through. Under gateway V1 there is nothing to tick."
S1_RECONNECT = "After a restart of the Miniserver the central <i>reconnect</i> on the page “LoxBerry MQTT-Gateway” of the sample project fetches the retained values (dienst, autostart, titles) again."
S2_TEXT = "Create one <b>virtual input</b> per value (Periphery → Virtual Inputs) with exactly this name – the MQTT gateway delivers under this name. Do not tick “Use as digital input”. Texts (event, titles, screensaver) as a <b>virtual text input</b>. Since 1.2.22 there is no import template for the inputs any more: it created HTTP inputs that are never polled."
S2_RECHTE = "The user the MQTT gateway logs in with at the Miniserver needs rights on the virtual inputs – otherwise they stay empty."
