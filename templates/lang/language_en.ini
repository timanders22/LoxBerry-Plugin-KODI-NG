H_WEB = "Opens %s in a new tab — the address under which you are currently viewing <i>this</i> LoxBerry. Not <span class='sm-mono'>127.0.0.1</span>: in the field above that is correct, because the plugin runs on the same machine as Kodi, but in a browser it means your own computer.<br>For anything to appear there, two settings are needed in Kodi: <i>Settings → Services → Control → Allow remote control via HTTP</i>, and below it a <i>Web interface</i>. If that says <i>None</i>, you get a <b>blank page</b> — Kodi has shipped without one since version 18; it is installed as an add-on (Chorus2, for example). <b>This plugin does not need it</b>: it talks to Kodi via <span class='sm-mono'>/jsonrpc</span>, which answers without it."
H_ZUGANG = "Recent Kodi versions require a user name and password for the web interface. Both are set in Kodi under <i>Settings → Services → Control</i>. If the fields stay empty the query goes out unauthenticated; if Kodi answers with 401, the Test tab says so."
L_AUTOSTART = "Start Kodi automatically at boot"
H_SENDER = "Status sender"
SENDER_TEXT = "<b>On by default – on a new installation from the first save;</b> an update does not change the saved value. When on, the plugin reports a sign of life every minute (<span class='sm-mono'>status/zaehler</span>, <span class='sm-mono'>status/ts</span>, <span class='sm-mono'>status/ok</span>, and for existing installations still <span class='sm-mono'>zeitstempel</span> and <span class='sm-mono'>herzschlag</span>) and Kodi's state at the configured interval to the MQTT gateway. Up to 1.1.9 it did not exist: the topics were published only when somebody pressed the test button on the Test tab."
L_SENDER = "Switch the status sender on"
L_TAKT = "Interval between two transmissions (seconds)"
H_TAKT = "Between 60 and 3600. Applies to Kodi's state; the sign of life goes out every minute regardless. The cron entry runs every minute and decides for itself whether to do anything."
L_RPC = "Also query Kodi over JSON-RPC (playback and title)"
H_RPC = "<b>Off by default and not tried on a device.</b> The methods used are documented in Kodi's JSON-RPC reference; whether this Kodi accepts them has not been measured in-house — on 17.09.2026 Kodi did not run on the LoxBerry for lack of a graphics driver. What cannot be read is reported as <span class='sm-mono'>-</span>, not as success. <b>Mind the port:</b> on the house LoxBerry another plugin (FOSHKplugin) listens on 8080; the Test tab then says who answered, and Kodi's web server needs a different port."
H_LIZENZ = "Licence keys"
LIZENZ_HINWEIS = "The keys are sold in the Raspberry Pi shop and are bound to serial number %s. They are written into <span class='sm-mono'>config.txt</span> and take effect after a reboot. <b>An empty field deletes nothing</b> — the stored value stays."
