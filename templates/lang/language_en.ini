H_HOST = "Usually %s when Kodi runs on the same LoxBerry."
L_PORT = "Port of the Kodi web interface"
H_PORT = "Default 8080. <b>The plugin</b> queries Kodi through this port. Loxone talks to Kodi separately via <span class='sm-mono'>tcp://…:9090</span> — a different path and a different port."
L_USER = "User name for Kodi (if set)"
L_PASS = "Password for Kodi (if set)"
H_WEB = "Opens %s in a new tab — the address under which you are currently viewing <i>this</i> LoxBerry. Not <span class='sm-mono'>127.0.0.1</span>: in the field above that is correct, because the plugin runs on the same machine as Kodi, but in a browser it means your own computer.<br>For anything to appear there, two settings are needed in Kodi: <i>Settings → Services → Control → Allow remote control via HTTP</i>, and below it a <i>Web interface</i>. If that says <i>None</i>, you get a <b>blank page</b> — Kodi has shipped without one since version 18; it is installed as an add-on (Chorus2, for example). <b>This plugin does not need it</b>: it talks to Kodi via <span class='sm-mono'>/jsonrpc</span>, which answers without it."
H_ZUGANG = "Recent Kodi versions require a user name and password for the web interface. Both are set in Kodi under <i>Settings &rarr; Services &rarr; Control</i>. If the fields stay empty the query goes out unauthenticated; if Kodi answers with 401, the Test tab says so."
L_AUTOSTART = "Start Kodi automatically at boot"
H_SENDER = "Status sender"
SENDER_TEXT = "<b>Off by default.</b> When on, the plugin reports state and timestamp to the MQTT gateway every few minutes on its own. Up to 1.1.9 it did not exist: the topics <span class='sm-mono'>dienst</span>, <span class='sm-mono'>autostart</span> and <span class='sm-mono'>zeitstempel</span> were published only when somebody pressed the test button — so the matching virtual inputs in Loxone stayed empty forever."
L_SENDER = "Switch the status sender on"
L_TAKT = "Interval between two transmissions (seconds)"
H_TAKT = "Between 60 and 3600. The cron entry runs every minute and decides for itself whether to do anything — the interval lives here, not in the name of the cron folder."
L_RPC = "Also query Kodi over JSON-RPC (playback and title)"
H_RPC = "<b>Off by default and not tried on a device.</b> The methods used are documented in Kodi's JSON-RPC reference; whether this Kodi accepts them could not be measured here — none was running. What cannot be read is reported as <span class='sm-mono'>-</span>, not as success."
H_LIZENZ = "Licence keys"
LIZENZ_HINWEIS = "The keys are sold in the Raspberry Pi shop and are bound to serial number %s. They are written into <span class='sm-mono'>config.txt</span> and take effect after a reboot. <b>An empty field deletes nothing</b> — the stored value stays."
