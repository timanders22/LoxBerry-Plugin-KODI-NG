S3_HAKEN_AUS = "<b>The tick “Accept commands via MQTT” is off</b> (MQTT tab) – the plugin rejects every command (“abgelehnt: ausgeschaltet”)."
S3_STEUERN_AUS = "“Kodi: quit” only works with the second tick “Allow intervening commands via MQTT” (MQTT tab); all other commands already work."
S3_PRAEFIX = "The prefix %s contains a dot – it is not allowed for commands via MQTT. Enter a prefix without a dot on the MQTT tab."
K_VORLAGE_MQTT = "Create the MQTT commands template"
S3_VORLAGE = "The template creates a separate virtual output “Kodi Befehle (MQTT)” with all %d commands, address %s. If you already have the output “LoxBerry MQTT-Gateway” of the sample project, create the commands there instead (command on ON as in the table). Loxone Config creates new blocks on import and overwrites nothing."
S3_NICHTS = "For commands there is nothing to enter under gateway V1 or V2."
S4_MUSTER = "The sample project does not need this route. Whoever has switched over turns off “Allow Kodi's remote control from the home network”."
L_NETZ = "Allow Kodi's remote control from the home network (tcp://…:9090, EventServer)"
H_NETZ = "On by default (as before). Off: Kodi accepts JSON-RPC on TCP 9090 and the EventServer on UDP 9777 only from the LoxBerry itself – commands via MQTT keep working, phone apps such as Kore or Yatse from the network no longer do (not measured). Takes effect only after Kodi restarts (Settings tab). An update keeps the setting."
