ZU = "<b>On #4:</b> Loxone counts seconds since 01.01.2009, the topic seconds since 1970; hence <span class='sm-mono'>+ 1230768000</span>. Which block in Loxone Config supplies the Loxone time has not been measured on the Miniserver in this house — whoever connects it checks that its value is around 560 million, not 1.7 billion.<br><b>On #5:</b> Put the threshold well above the one-minute cycle of the sign of life so that a single missed run does not raise a message. The gateway's UDP input drops packets under load (measured on the house LoxBerry).<br><b>On #6:</b> A 0 in <span class='sm-mono'>status/ok</span> means: the last run could not query the Kodi service. The value is not retained; if it stops arriving, the sign of life (#5) reports the failure.<br><b>On #9:</b> The notification block only sends on a change from off to on. Never put several sources directly on its input — combine them via OR (#7) first.<br><b>Prerequisite for everything:</b> the status sender is switched on (MQTT tab)."
