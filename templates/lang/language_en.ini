WAS_IST_DAS = "<b>Kodi right on the LoxBerry, connected to Loxone.</b> The plugin installs Kodi on the LoxBerry (Raspberry Pi) and sets it up. State and events go over MQTT through the LoxBerry MQTT Gateway to the Miniserver, and on request over UDP as well; the Miniserver controls Kodi through JSON-RPC. The plugin generates the import files for Loxone Config itself."

