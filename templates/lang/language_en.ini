[MQTT]
L_THEMA = "MQTT topic of the plugin"
H_THEMA = "The plugin's values appear below it, for example %s. Allowed are letters, digits, dot, underscore, hyphen and slash — at most 64 characters. <b>No <span class='sm-mono'>#</span> and no <span class='sm-mono'>+</span>:</b> those are MQTT wildcards and are not valid in a topic you publish under. The Kodi add-on carries its own topic — the table below shows both side by side."

[ADDON]
H = "Settings inside the Kodi add-on"
TEXT = "The add-on <i>LoxBerry Kodi Callback Handler</i> runs <b>inside Kodi</b> and therefore has settings of its own. Four of them belong to the plugin: whether MQTT is used at all, to which address, to which port and under which topic. Up to 1.1.9 they were entered in Kodi by hand and drifted apart unnoticed — changing the topic in the plugin gave you a table with the new name while the add-on kept publishing under the old one."
TH_FELD = "Field in the add-on"
TH_IST = "currently there"
TH_SOLL = "should be there"
GEHOERT_ANWENDER = "yours — not overwritten"
NICHT_LESBAR = "<b>The add-on settings could not be read.</b> Either they do not exist yet — then the add-on has never run inside Kodi — or Kodi lives somewhere else. The button creates the file in both cases, as soon as Kodi is stopped."
L_ANHALTEN = "Stop Kodi for this and start it again afterwards"
H_ANHALTEN = "<b>Without this tick the write is refused while Kodi runs</b> — and that is deliberate: Kodi writes its settings file back from memory when it quits and would undo the change. A switch that only takes effect on somebody else's next action is not a switch."
K_SETZEN = "Set add-on settings"
M_UNVOLLSTAENDIG = "Nothing was written: these values cannot be determined — %s. A guessed address in the add-on would be worse than none; the add-on would send into the void while the interface claimed it was configured."
M_LAEUFT = "Kodi is running. <b>Nothing</b> was written — Kodi would overwrite the file when it quits. Either stop Kodi on the Test tab, or set the tick above."
M_FEHL = "The helper did not write the add-on settings: %s"
M_OK = "%d fields set in the add-on and measured afterwards."
M_NEUGESTARTET = "Kodi was stopped for this and started again."
M_GESCHRIEBEN_UNGEPRUEFT = "The helper reports success, but the file could not be read afterwards. Whether the values arrived is therefore <b>not</b> established — press <i>Show add-on settings</i> on the Test tab."
M_NACHGEMESSEN_ABWEICHUNG = "The helper reports success, but on measuring afterwards these fields read differently: %s"

[LOX]
H = "How the values reach the Miniserver"
SCHRITT1 = "<b>1. Enable the UDP input of the gateway.</b> The MQTT gateway is part of LoxBerry — you find it in the main menu under <i>Services &rarr; MQTT Gateway</i>, no plugin has to be installed for it. Under <i>General</i> switch on the UDP input (default port 11884). That port currently is %s."
NICHT_GESETZT = "not set"
SCHRITT2 = "<b>2. Find the topics.</b> Open the <i>MQTT finder</i> in the gateway and expand the branch %s. Whatever Kodi and the plugin report appears there. To try it out, press <i>Send test event to MQTT</i> on the <i>Test</i> tab."
ABO_PFLICHT = "<b>Without this entry nothing arrives at the Miniserver.</b> This is by far the most common cause of failure."
ABO_V2 = "<b>MQTT Gateway V2 discovers the topic group by itself</b> — nothing has to be entered. The group appears in <i>Subscriptions</i>; tick the datapoints you want there. If it does not appear, nothing has been published yet: then first check on the Test tab whether anything is being sent at all."
SCHRITT3_V1 = "<b>3. Use it in Loxone (gateway V1).</b> Enter the subscription under <i>Subscriptions</i> in the gateway and assign the topics to the Miniserver; they appear there as virtual inputs. No virtual output is needed for this."
SCHRITT3_V2 = "<b>3. Use it in Loxone (gateway V2).</b> Tick the datapoints you want in <i>Subscriptions</i>; the gateway offers them to the Miniserver as virtual inputs. Nothing is entered by hand."
H_THEMEN = "Topics"
THEMEN_HINWEIS = "This table is the manual, and the plugin measures it itself — the row <i>topic list</i> on the Test tab holds it against the sending code. Up to 1.1.9 it named two topics that did not exist at all."
TH_THEMA = "Topic"
TH_BEDEUTUNG = "Meaning"
TH_WERTE = "Values"
TH_QUELLE = "sender"
TH_VORLAGE = "in the template"
Q_PLUGIN = "Plugin (cron)"
Q_ADDON = "Kodi add-on"
TEXTTHEMEN = "The template contains only the numeric values. Text topics get no virtual input — not via the XML route either; they are assigned individually in the gateway. The Kodi add-on carries its own topic, which is set on the MQTT tab; by default it is the same one."
SENDER_AUS = "<b>The status sender is switched off.</b> The plugin's seven topics are therefore not sent, and the virtual inputs from the template stay empty. Switch it on under Settings."
H_VORLAGE = "Create everything at once"
H_VORLAGE_TEXT = "Instead of creating every input by hand: these files create the inputs and outputs with the correct names. <b>Careful:</b> Loxone Config creates anew on import and overwrites nothing — importing twice gives you duplicate blocks."
K_VORLAGE = "Create template for the readings"
K_VORLAGE_VO = "Create template for the control commands"
H_STEUERN = "Controlling Kodi"
STEUERN_TEXT = "The other way round — Loxone controlling Kodi — goes through Kodi's TCP interface. The Miniserver talks to Kodi <b>directly</b>, not through the LoxBerry; the plugin's folder name appears in no Loxone address. A virtual output with this address is enough:"
VORLAGE_HINWEIS = "The button <i>Create template for the control commands</i> above produces exactly this output with all 26 commands and the address entered here. The file <span class='sm-mono'>data/VO_Kodi_V1.xml</span> that used to ship alongside is <b>gone</b> since 1.2.0: it was a second copy of the same content, it had fallen behind the generator, and it carried the placeholder <span class='sm-mono'>loxberry</span> instead of your address."

