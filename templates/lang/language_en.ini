; Kodi NG - English
;
; Every value is wrapped in double quotes and contains none itself:
; parse_ini_file cuts a value off at the second double quote. Attributes in
; the markup are therefore single-quoted.
;
; The values are output raw, not through ko_e() - the markup is meant to take
; effect.
;
; %s, %n and %t are placeholders filled in by the interface.

