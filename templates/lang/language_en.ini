[ADDON]
H = "Settings inside the Kodi add-on"
TEXT = "The add-on <i>LoxBerry Kodi Callback Handler</i> runs <b>inside Kodi</b> and therefore has settings of its own. Four of them belong to the plugin: whether MQTT is used at all, to which address, to which port and under which topic. Up to 1.1.9 they were entered in Kodi by hand and drifted apart unnoticed — changing the topic in the plugin gave you a table with the new name while the add-on kept publishing under the old one."
