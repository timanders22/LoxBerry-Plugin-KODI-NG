L_ANHALTEN = "Stop Kodi for this and start it again afterwards"
H_ANHALTEN = "<b>Without this tick the write is refused while Kodi runs</b> — and that is deliberate: Kodi writes its settings file back from memory when it quits and would undo the change. A switch that only takes effect on somebody else's next action is not a switch."
K_SETZEN = "Set add-on settings"
M_UNVOLLSTAENDIG = "Nothing was written: these values cannot be determined — %s. A guessed address in the add-on would be worse than none; the add-on would send into the void while the interface claimed it was configured."
