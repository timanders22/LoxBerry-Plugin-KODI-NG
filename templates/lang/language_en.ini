; Kodi NG - English
;
; Every value is wrapped in double quotes and contains none itself:
; parse_ini_file truncates a value at the second quote. Markup attributes are
; therefore single-quoted, and quotation in running text is typographic.
;
; Values carrying markup are printed RAW - the markup is meant to work. Plain
; labels go through ko_e() and must therefore contain NO entity.
;
; %s and %d are sprintf placeholders. Their order is binding - it is fixed at
; the call site in the source.
;
; THE GATEWAY-VERSION SENTENCE APPEARS EXACTLY ONCE: in LOX.ABO_PFLICHT.
; Writing it a second time anywhere cancels the case distinction on the
; Loxone tab - under gateway V2 both statements would then stand on the same
; page. The check "statements about the gateway version" on the Test tab
; counts exactly that.

