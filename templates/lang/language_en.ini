SCHRITTE_TITEL = "How to take over this page"
HINWEISE_TITEL = "Notes"
S1_SCHRITT1 = "LoxBerry → Services → MQTT Gateway → General: switch on the UDP input (default port 11884) and save."
S1_SCHRITT2 = "In the plugin, tab “MQTT”: tick “%s” and save. Then press “%s” on the same tab (tick “%s”) – only then does Kodi itself report its events."
S1_SCHRITT3 = "On the same tab tick “%s” and save – without this tick the plugin rejects the commands of these pages. “Kodi: quit” (page “Kodi-NG Wiedergabe”) also needs “%s”."
S1_SCHRITT4 = "If you want the response check (#21–#28): on the tab “%s” set the tick “%s” and save – otherwise %s never comes."
S1_SCHRITT5 = "Under MQTT gateway version 2: tick the data points of the tick list from step 1 of this tab under Subscriptions, for “tick + Noncached” also that box. Under version 1 the plugin creates the subscription itself."
S1_SCHRITT6 = "In Loxone Config create five virtual inputs (Periphery → Virtual Inputs → Virtual input), names exactly: %s, %s, %s, %s, %s – the button “copy” in the name table (step 2) helps. Do not tick “Use as digital input”; limits as in the list."
S1_SCHRITT7 = "Create virtual inputs (Periphery → Virtual Inputs → Virtual input, “Use in visualisation” on): button “Kodi Wiedergabe/Pause” (input type push button), switch “Antwortprüfung ein” (input type switch, start value off)."
S1_SCHRITT8 = "Create three notifications (Periphery → Messages → Notification): “Kodi NG Meldung”, “Kodi ausgefallen”, “Kodi antwortet nicht”, texts as in the list, and drag them onto the page. Each gets exactly one connection."
S1_SCHRITT9 = "Place the remaining blocks via the block search (key F5), parameters as in the list, and wire them from top to bottom according to the column “%s”. Status blocks: rows in the given order, the row without condition last."
S1_SCHRITT10 = "Save and transfer to the Miniserver. Cross-check: %s must change every minute, “Lebenszeichen” shows “in Ordnung”. Only then continue wiring."
S1_SCHRITT11 = "If you set the tick in step 3: switch on “Antwortprüfung ein” in the app."
S1_H1 = "The analog value validation (#5) gets the constant 1 at En. Config creates input En inverted (tick at ‘En’ in the properties under Parameters). Remove this tick, otherwise constant 1 arrives as 0 and the failure message never triggers."
S1_H2 = "If you set the sending interval on the MQTT tab above 300 s, set both 600 s (#18, #26) to twice the new interval."
S1_H3 = "“Kodi ausgefallen” also reports after “Kodi beenden” (page “Kodi-NG Wiedergabe”) – Kodi then only starts again via the button “%s” on the tab “%s” or with the next restart of the LoxBerry."
S1_H4 = "Without the tick “JSON-RPC”, %s stays at 0; that is why #27 only reports with “Antwortprüfung ein” switched on."
S2_SCHRITT1 = "Ticks and output as on page “Kodi-NG”."
S2_SCHRITT2 = "New page “Kodi-NG Fernbedienung”. Create the twelve commands %s on the virtual output “%s” (command on ON as in the list) and drag them onto the page."
S2_SCHRITT3 = "Create twelve buttons (Periphery → Virtual Inputs → Virtual input, input type push button, “Use in visualisation” on), names as in the list; each button to exactly one command."
S2_SCHRITT4 = "Save, transfer. Test: press “Kodi Startbildschirm” in the app – Kodi shows the home screen."
S2_H1 = "Assign the buttons in the app to a common category “Kodi”; then they sit together like a remote control."
S2_H2 = "If nothing arrives: read the rows “Is the command bridge running?” and “Does the bridge reach Kodi?” on the Test tab of the plugin; every acknowledgement is in the MQTT Finder under %s. Kodi must be running (page “Kodi-NG”)."
S3_SCHRITT1 = "Ticks and output as on page “Kodi-NG” (no second import)."
S3_SCHRITT2 = "New page “Kodi-NG Wiedergabe”. Create the 13 commands of the list on the virtual output “%s” and drag them onto the page. NOT “%s” again – an output command may only be in the project once."
S3_SCHRITT3 = "Create virtual inputs (“Use in visualisation” on): 14 buttons (input type push button) as in the list, among them the placeholder “Türklingel (eigene Quelle)”; 1 switch “Niemand zu Hause (eigene Quelle)” (input type switch, start value off)."
S3_SCHRITT4 = "Your own sources: if your project has a doorbell, connect it to #5 “Pause senden” (input I2) and delete the button #4. If you have a presence source (alarm system armed, central off), connect it to #9 “Haus verlassen” and delete the switch #8. Without your own source both stay as buttons in the app."
S3_SCHRITT5 = "Create the text inputs: Periphery → Virtual Inputs → Virtual text input, five times, name exactly: %s – the way the MQTT gateway names the topics (slash becomes underscore). With gateway V2 tick the five datapoints under %s in the subscriptions."
S3_SCHRITT6 = "Place the status “Kodi spielt” (F5) and extend it to five inputs with “+” – the inputs from V5 on only appear after clicking the “+” on the block. Enter the rows in the given order (the row without condition last), status value 1 for “Film läuft” and “Serie läuft”, otherwise 0."
S3_SCHRITT7 = "Place the remaining blocks (2 OR, 2 Edge detection, Pd 1 s) and wire them from top to bottom according to the column “%s”."
S3_SCHRITT8 = "Save, transfer. Test: start a movie in Kodi – “Kodi spielt” shows “Film läuft: <title>”; press “Türklingel (eigene Quelle)” in the app – the movie pauses; “Kodi abspielen” – it continues."
S3_H1 = "“Film oder Serie läuft” (#38) is the connection for your own lighting: output On to the cinema mood, output Off back. Music deliberately does not dim. If you also have the Heimkino plugin, On can switch its “Kino-Modus” in your own project."
S3_H2 = "Further reasons to pause (phone, baby monitor) go through a further OR in front of #5 – an OR has only two inputs."
S3_H3 = "“Kodi beenden” closes Kodi completely; start it again in the plugin (tab “%s”) or with the next restart of the LoxBerry. Via MQTT it only works with the second tick “%s”."
S3_H4 = "After a restart of the Miniserver “Kodi spielt” shows “keine Wiedergabe” until Kodi reports the next event (pause, resume, new movie): the event is not retained, so that an old movie start does not arrive as a new one."
S3_H5 = "The titles only arrive while the Kodi add-on sends via MQTT (MQTT tab, “%s”)."
S1_13_PARAM = "command on ON: publish %s 1 (never retain); acts on the current playback (film or music); works only with the tick “Accept commands via MQTT” (MQTT tab of the plugin)"
S2_02_PARAM = "command on ON: publish %s 1 (never retain); every press goes out; works with the tick “Accept commands via MQTT” (MQTT tab of the plugin)"
S2_VO_PARAM = "command on ON: publish %s 1; tick as no. 2"
S3_02_PARAM = "command on ON: publish %s 1 (never retain); resumes paused playback (film or music); works with the tick “Accept commands via MQTT”"
S3_06_PARAM = "command on ON: publish %s 1; pauses the current playback, music too; if nothing plays, the plugin acknowledges “no player” (not an error); tick as no. 2"
S3_VO_PARAM = "command on ON: publish %s 1; tick as no. 2"
S3_VO_JEDER_PARAM = "command on ON: publish %s 1; every press counts; tick as no. 2"
S3_31_PARAM = "command on ON: publish %s 1 (never retain); the same command within 60 s is not repeated; works only with “Accept commands via MQTT” AND “Allow intervening commands via MQTT” (MQTT tab of the plugin)"
S1_SCHRITT6B = "Create the virtual output “%s” (address %s) if the project does not have it yet – or press “%s” in step 3 and import the file once (Periphery → Virtual Outputs → import template)."
S1_SCHRITT6C = "Create a new page “Kodi-NG”, drag the five inputs onto it, create the command “%2$s” on the output “%1$s” (command on ON as in the list) and drag it onto the page."
S1_H5 = "Commands only work with the tick “Accept commands via MQTT”. Whether one arrived shows the acknowledgement in the MQTT Finder under %s (…/quittung: accepted or rejected with a reason)."

[BEFEHL]

H = "Commands via MQTT"
TEXT = "Loxone sends commands to the plugin via the MQTT gateway (topics below %s; the list is on the tab <i>Integration into Loxone</i>, step 3). The plugin's command bridge passes each one on to Kodi – JSON-RPC over HTTP, the same route and port as the query on the Settings tab – and acknowledges it. Without the first tick it accepts none."
L_EIN = "Accept commands via MQTT"
H_EIN = "Off by default. Covers 25 buttons: navigation, playback, seeking, next/previous item, volume and mute. Saving starts or stops the command bridge right away; otherwise the watchdog does it within a minute."
L_STEUERN = "Allow intervening commands via MQTT (quit Kodi)"
H_STEUERN = "Off by default. Applies only to “Kodi: quit” – Kodi then stays off until it is started on the Settings tab or the LoxBerry restarts. The same command is not repeated within 60 s."
HEIMNETZ = "Anyone on the home network can send commands via the UDP input of the MQTT gateway – that is why both ticks are off by default."
M_PRAEFIX = "For commands via MQTT the prefix must not contain a dot (per level only letters, digits, underscore and hyphen): “%s”. Either change the prefix or leave the tick “Accept commands via MQTT” off."
M_GESTARTET = "Command bridge started: %s"
M_ANGEHALTEN = "Command bridge stopped: %s"
M_START_FEHL = "The command bridge could not be started: %s – the watchdog tries again every minute (at most every 10 minutes); read the row “Is the command bridge running?” on the Test tab."
M_STOP_FEHL = "The command bridge could not be stopped: %s"
T_TITEL = "Command (name in Loxone Config)"
T_THEMA = "Command on ON"
T_EINGREIFEND = "intervening"
T_SPERRE = "Lock"
T_JA_ZWEITER = "yes – also needs “Allow intervening commands via MQTT”"
T_NEIN = "no"
QUITTUNG = "The plugin acknowledges every command under %s – “angenommen” (accepted) or “abgelehnt” (rejected) with a reason, never retained; for example “abgelehnt: KEIN_SPIELER” when nothing is playing, or “abgelehnt: KODI_ANTWORTET_NICHT”. The sample project does not read the acknowledgement; the effect shows in kodi_event."

