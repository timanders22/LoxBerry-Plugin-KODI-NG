HINWEIS = "The purpose is <b>moving house</b> to a second LoxBerry, not protection against loss — the second copy next to the configuration folder does that. More than the configuration file is saved: the autostart setting and the seven fields that live in the Kodi add-on. On restore every line is checked; a partially valid file overwrites <b>nothing</b>."
