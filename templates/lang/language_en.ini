[BAUSTEIN]
VORTEXT = "Three pages from the LoxBerry plugins sample project, every row one block (block search in Loxone Config: key <b>F5</b>). The first shows whether Kodi is running and whether the plugin reports, and reports failures – it is enough to start with. The second puts the menu buttons of a remote control into the app, the third playback and sound with automations (pause on the doorbell, stop when leaving the house, hook for the light at film start). The inputs are virtual inputs with the name the MQTT gateway assigns (step 2); the commands hang on the virtual output %s and go to the plugin via MQTT (step 3)."
SP_BAUSTEIN = "Block (type)"
SP_NAME = "Name (suggestion)"
SP_PARAMETER = "Parameters"
SP_EINGAENGE = "Connect inputs to"
BEF_TITEL = "Commands of the template “%s”"
BEF_SP_BEFEHL = "Command (name in Config)"
BEF_SP_BEDEUTUNG = "Meaning"
BEF_UNTERSCHRIFT = "All commands of the TCP template in their order; the file contains the JSON-RPC command for each."
S1_01_PARAM = "1 = Kodi running (service kodi_ng active), 0 = off (retained; comes with the status sender every 5 minutes – switch it on on the MQTT tab of the plugin); if the plugin's helper does not answer, the last value stays and kodi_status_ok goes to 0"
S1_02_PARAM = "sign of life: counts up by one with every run of the status sender (every minute), 0 to 999, wraps around (never retained)"
S1_03_PARAM = "1 = the status sender could query Kodi's service; comes every minute, never retained; MQTT gateway version 2: tick and “Noncached”"
S1_04_PARAM = "value 1"
S1_04_NAME = "Konstante 1"
S1_05_PARAM = "Tmc 300 s (five signs of life without a new one), Min 0, Max 999; remove the tick at ‘En’ in the properties window"
S1_05_NAME = "Kodi NG stumm"
S1_06_NAME = "Kodi NG meldet Fehler"
S1_07_NAME = "Kodi NG gestört"
S1_08_PARAM = "120 s"
S1_08_NAME = "Kodi NG Störung bestätigt"
S1_09_PARAM = "text: Kodi NG – no sign of life from the plugin for 5 minutes, or it cannot query Kodi's service; read the row ‘Is the status sender sending?’ on the Test tab of the plugin, check the ticks under MQTT gateway version 2"
S1_09_NAME = "Kodi NG Meldung"
S1_10_PARAM = "I1+2*I2 (0 = off, 1 = running, 2 = disturbed, 3 = running but disturbed)"
S1_10_NAME = "Kodi NG Zustandszahl"
