; Kodi NG - Deutsch
;
; Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt selbst keine:
; parse_ini_file schneidet einen Wert am zweiten Anfuehrungszeichen ab.
; Attribute in der Auszeichnung sind deshalb einfach quotiert, und Anfuehrung
; im Text wird typografisch gesetzt.
;
; Die Werte mit Auszeichnung werden ROH ausgegeben, nicht ueber ko_e() - die
; Auszeichnung soll wirken. Reine Beschriftungen laufen dagegen durch ko_e()
; und duerfen deshalb KEINE Entitaet enthalten; Umlaute stehen als echte
; UTF-8-Zeichen.
;
; %s und %d sind Platzhalter fuer sprintf. Ihre Reihenfolge ist verbindlich -
; sie steht im Quelltext an der jeweiligen Aufrufstelle.
;
; DER SATZ ZUR GATEWAY-FASSUNG STEHT GENAU EINMAL: in LOX.ABO_PFLICHT. Wer
; ihn ein zweites Mal irgendwo hinschreibt, hebt die Fallunterscheidung im
; Reiter Einbindung wieder auf - unter Gateway V2 stuenden dann beide
; Aussagen auf derselben Seite. Die Pruefzeile "Aussagen zur Gateway-Fassung"
; im Reiter Test zaehlt genau das nach.

