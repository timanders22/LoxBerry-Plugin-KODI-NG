S1_SCHRITT1 = "LoxBerry → Dienste → MQTT Gateway → Allgemein: den UDP-Eingang einschalten (Standardport 11884) und speichern."
S1_SCHRITT2 = "Im Plugin Reiter „MQTT“: „%s“ setzen und speichern. Danach im selben Reiter „%s“ drücken (Haken „%s“ setzen) – erst dann meldet auch Kodi selbst seine Ereignisse."
S1_SCHRITT3 = "Im selben Reiter „%s“ setzen und speichern – ohne diesen Haken lehnt das Plugin die Befehle dieser Seiten ab. „Kodi: beenden“ (Seite „Kodi-NG Wiedergabe“) braucht zusätzlich „%s“."
S1_SCHRITT4 = "Wer die Antwortprüfung (#21–#28) will: im Reiter „%s“ den Haken „%s“ setzen und speichern – sonst kommt %s nie."
S1_SCHRITT5 = "Unter MQTT-Gateway Fassung 2: in den Subscriptions die Datenpunkte der Hakenliste aus Schritt 1 dieses Reiters anhaken, bei „Haken + Noncached“ auch dieses Kästchen. Unter Fassung 1 legt das Plugin das Abo selbst an."
S1_SCHRITT6 = "In Loxone Config fünf Virtuelle Eingänge anlegen (Peripherie → Virtuelle Eingänge → Virtueller Eingang), Name genau so: %s, %s, %s, %s, %s – der Knopf „kopieren“ in der Namenstabelle (Schritt 2) hilft. „Als Digitaleingang“ nicht anhaken; Grenzen wie in der Liste."
S1_SCHRITT7 = "Virtuelle Eingänge anlegen (Peripherie → Virtuelle Eingänge → Virtueller Eingang, „In Visualisierung verwenden“ an): Taste „Kodi Wiedergabe/Pause“ (Eingabeart Taster), Schalter „Antwortprüfung ein“ (Eingabeart Schalter, Startwert aus)."
S1_SCHRITT8 = "Drei Benachrichtigungen anlegen (Peripherie → Mitteilungen → Benachrichtigung): „Kodi NG Meldung“, „Kodi ausgefallen“, „Kodi antwortet nicht“, Texte wie in der Liste, und auf die Seite ziehen. Jede bekommt genau eine Leitung."
S1_SCHRITT9 = "Die übrigen Bausteine über die Baustein-Suche (Taste F5) setzen, Parameter wie in der Liste, nach der Spalte „%s“ von oben nach unten verbinden. Status-Bausteine: Zeilen in der angegebenen Reihenfolge, die Zeile ohne Bedingung zuletzt."
S1_SCHRITT10 = "Speichern und in den Miniserver übertragen. Gegenprobe: %s muss sich jede Minute ändern, „Lebenszeichen“ zeigt „in Ordnung“. Erst dann weiter verdrahten."
S1_SCHRITT11 = "Wer in Schritt 3 den Haken gesetzt hat: in der App „Antwortprüfung ein“ einschalten."
S1_H1 = "Die Analogwertvalidierung (#5) bekommt an En die Konstante 1. Config legt den Eingang En negiert an (Haken bei ‚En‘ im Eigenschaftsfenster unter Parameter). Diesen Haken entfernen, sonst kommt die Konstante 1 als 0 an und die Ausfallmeldung löst nie aus."
S1_H2 = "Wer den Sendeabstand im Reiter MQTT über 300 s stellt, setzt die beiden 600 s (#18, #26) auf das Doppelte des neuen Abstands."
S1_H3 = "„Kodi ausgefallen“ meldet sich auch nach „Kodi beenden“ (Seite „Kodi-NG Wiedergabe“) – Kodi startet dann erst wieder über den Knopf „%s“ im Reiter „%s“ oder mit dem nächsten Neustart des LoxBerry."
S1_H4 = "Ohne Haken „JSON-RPC“ bleibt %s auf 0; deshalb meldet #27 nur bei eingeschalteter „Antwortprüfung ein“."
S2_SCHRITT1 = "Haken und Ausgang wie auf Seite „Kodi-NG“."
S2_SCHRITT2 = "Neue Seite „Kodi-NG Fernbedienung“. Die zwölf Befehle %s am Virtuellen Ausgang „%s“ anlegen (Befehl bei EIN wie in der Liste) und auf die Seite ziehen."
S2_SCHRITT3 = "Zwölf Tasten anlegen (Peripherie → Virtuelle Eingänge → Virtueller Eingang, Eingabeart Taster, „In Visualisierung verwenden“ an), Namen wie in der Liste; jede Taste an genau einen Befehl."
S2_SCHRITT4 = "Speichern, übertragen. Probe: in der App „Kodi Startbildschirm“ drücken – Kodi zeigt den Startbildschirm."
S2_H1 = "Die Tasten in der App einer gemeinsamen Kategorie „Kodi“ zuordnen, dann liegen sie wie eine Fernbedienung beisammen."
S2_H2 = "Kommt nichts an: im Plugin Reiter Test die Zeilen „Läuft die Befehlsbrücke?“ und „Erreicht die Brücke Kodi?“ lesen; jede Quittung steht im MQTT Finder unter %s. Kodi muss laufen (Seite „Kodi-NG“)."
S3_SCHRITT1 = "Haken und Ausgang wie auf Seite „Kodi-NG“ (kein zweiter Import)."
S3_SCHRITT2 = "Neue Seite „Kodi-NG Wiedergabe“. Die 13 Befehle der Liste am Virtuellen Ausgang „%s“ anlegen und auf die Seite ziehen. „%s“ NICHT noch einmal – ein Ausgangsbefehl darf nur einmal im Projekt stehen."
S3_SCHRITT3 = "Virtuelle Eingänge anlegen („In Visualisierung verwenden“ an): 14 Tasten (Eingabeart Taster) wie in der Liste, darunter der Platzhalter „Türklingel (eigene Quelle)“; 1 Schalter „Niemand zu Hause (eigene Quelle)“ (Eingabeart Schalter, Startwert aus)."
S3_SCHRITT4 = "Eigene Quellen: Wer eine Klingel im Projekt hat, legt deren Leitung an #5 „Pause senden“ (Eingang I2) und löscht die Taste #4. Wer eine Anwesenheit hat (Alarmanlage scharf, Zentral-Aus), legt deren Leitung an #9 „Haus verlassen“ und löscht den Schalter #8. Ohne eigene Quelle bleiben beide als Knöpfe in der App."
S3_SCHRITT5 = "Die Texteingänge anlegen: Peripherie → Virtuelle Eingänge → Virtueller Texteingang, fünfmal, Name genau so: %s – so, wie das MQTT-Gateway die Themen benennt (Schrägstrich wird Unterstrich). Unter Gateway V2 die fünf Datenpunkte unter %s in den Subscriptions anhaken."
S3_SCHRITT6 = "Status „Kodi spielt“ (F5) setzen und mit „+“ auf fünf Eingänge erweitern – die Eingänge ab V5 erscheinen erst nach Klick auf das „+“ am Baustein. Die Zeilen in der angegebenen Reihenfolge eintragen (die Zeile ohne Bedingung zuletzt), bei „Film läuft“ und „Serie läuft“ den Statuswert 1, sonst 0."
S3_SCHRITT7 = "Übrige Bausteine (2 ODER, 2 Flankenerkennung, Pd 1 s) setzen und nach der Spalte „%s“ von oben nach unten verbinden."
S3_SCHRITT8 = "Speichern, übertragen. Probe: an Kodi einen Film starten – „Kodi spielt“ zeigt „Film läuft: <Titel>“; in der App „Türklingel (eigene Quelle)“ drücken – der Film hält an; „Kodi abspielen“ – er läuft weiter."
S3_H1 = "„Film oder Serie läuft“ (#38) ist der Anschluss für das eigene Licht: Ausgang On an die Kino-Stimmung, Ausgang Off zurück. Musik dimmt bewusst nicht. Wer auch das Heimkino-Plugin hat, kann im eigenen Projekt mit On den „Kino-Modus“ schalten."
S3_H2 = "Weitere Pausengründe (Telefon, Babyfon) über ein weiteres ODER vor #5 hängen – ein ODER hat nur zwei Eingänge."
S3_H3 = "„Kodi beenden“ schließt Kodi ganz; wieder starten im Plugin (Reiter „%s“) oder mit dem nächsten Neustart des LoxBerry. Über MQTT wirkt es nur mit dem zweiten Haken „%s“."
S3_H4 = "Nach einem Neustart des Miniservers zeigt „Kodi spielt“ „keine Wiedergabe“, bis Kodi das nächste Ereignis meldet (Pause, Weiter, neuer Film): das Ereignis wird nicht zurückbehalten, damit ein alter Filmstart nicht als neuer ankommt."
S3_H5 = "Die Titel kommen nur, solange das Kodi-Addon per MQTT sendet (Reiter MQTT, „%s“)."
S1_13_PARAM = "Befehl bei EIN: publish %s 1 (nie retain); wirkt auf die laufende Wiedergabe (Film oder Musik); wirkt nur mit dem Haken „Befehle über MQTT annehmen“ (Plugin Reiter MQTT)"
S2_02_PARAM = "Befehl bei EIN: publish %s 1 (nie retain); jeder Druck geht hinaus; wirkt mit dem Haken „Befehle über MQTT annehmen“ (Plugin Reiter MQTT)"
S2_VO_PARAM = "Befehl bei EIN: publish %s 1; Haken wie Nr. 2"
S3_02_PARAM = "Befehl bei EIN: publish %s 1 (nie retain); setzt die angehaltene Wiedergabe fort (Film oder Musik); wirkt mit dem Haken „Befehle über MQTT annehmen“"
S3_06_PARAM = "Befehl bei EIN: publish %s 1; pausiert die laufende Wiedergabe, auch Musik; läuft nichts, quittiert das Plugin „kein Spieler“ (kein Fehler); Haken wie Nr. 2"
S3_VO_PARAM = "Befehl bei EIN: publish %s 1; Haken wie Nr. 2"
S3_VO_JEDER_PARAM = "Befehl bei EIN: publish %s 1; jeder Druck zählt; Haken wie Nr. 2"
S3_31_PARAM = "Befehl bei EIN: publish %s 1 (nie retain); derselbe Befehl innerhalb von 60 s wird nicht wiederholt; wirkt nur mit „Befehle über MQTT annehmen“ UND „Eingreifende Befehle über MQTT zulassen“ (Plugin Reiter MQTT)"
S1_SCHRITT6B = "Den Virtuellen Ausgang „%s“ anlegen (Adresse %s), falls es ihn im Projekt noch nicht gibt – oder in Schritt 3 „%s“ drücken und die Datei einmal importieren (Peripherie → Virtuelle Ausgänge → Vorlage importieren)."
S1_SCHRITT6C = "Neue Seite „Kodi-NG“ anlegen, die fünf Eingänge darauf ziehen, am Ausgang „%s“ den Befehl „%s“ anlegen (Befehl bei EIN wie in der Liste) und auf die Seite ziehen."
S1_H5 = "Befehle wirken nur mit dem Haken „Befehle über MQTT annehmen“. Ob einer ankam, zeigt die Quittung im MQTT Finder unter %s (…/quittung: angenommen oder abgelehnt mit Grund)."

[BEFEHL]

H = "Befehle über MQTT"
TEXT = "Loxone schickt Befehle über das MQTT-Gateway an das Plugin (Themen unter %s, die Liste steht im Reiter <i>Einbindung in Loxone</i>, Schritt 3). Die Befehlsbrücke des Plugins gibt jeden an Kodi weiter – per JSON-RPC über HTTP, derselbe Weg und Port wie die Abfrage im Reiter Einstellungen – und quittiert ihn. Ohne den ersten Haken nimmt sie keinen an."
L_EIN = "Befehle über MQTT annehmen"
H_EIN = "Ab Werk aus. Gilt für 25 Tasten: Navigation, Wiedergabe, Spulen, Titelwechsel, Lautstärke und Stummschaltung. Speichern startet bzw. hält die Befehlsbrücke sofort; sonst tut es der Wächter binnen einer Minute."
L_STEUERN = "Eingreifende Befehle über MQTT zulassen (Kodi beenden)"
H_STEUERN = "Ab Werk aus. Gilt nur für „Kodi: beenden“ – Kodi bleibt danach aus, bis es im Reiter Einstellungen gestartet oder der LoxBerry neu gestartet wird. Derselbe Befehl wird innerhalb von 60 s nicht wiederholt."
HEIMNETZ = "Jeder im Heimnetz kann über den UDP-Eingang des MQTT-Gateways Befehle senden – deshalb sind beide Haken ab Werk aus."
M_PRAEFIX = "Für Befehle über MQTT darf das Präfix keinen Punkt enthalten (je Ebene nur Buchstaben, Ziffern, Unterstrich und Bindestrich): „%s“. Entweder das Präfix ändern oder den Haken „Befehle über MQTT annehmen“ weglassen."
M_GESTARTET = "Befehlsbrücke gestartet: %s"
M_ANGEHALTEN = "Befehlsbrücke angehalten: %s"
M_START_FEHL = "Die Befehlsbrücke ließ sich nicht starten: %s – der Wächter versucht es im Minutentakt erneut (höchstens alle 10 Minuten); im Reiter Test die Zeile „Läuft die Befehlsbrücke?“ lesen."
M_STOP_FEHL = "Die Befehlsbrücke ließ sich nicht anhalten: %s"
T_TITEL = "Befehl (Name in Loxone Config)"
T_THEMA = "Befehl bei EIN"
T_EINGREIFEND = "eingreifend"
T_SPERRE = "Sperre"
T_JA_ZWEITER = "ja – braucht zusätzlich „Eingreifende Befehle über MQTT zulassen“"
T_NEIN = "nein"
QUITTUNG = "Das Plugin quittiert jeden Befehl unter %s – „angenommen“ oder „abgelehnt“ mit Grund, nie zurückbehalten; etwa „abgelehnt: KEIN_SPIELER“, wenn nichts läuft, oder „abgelehnt: KODI_ANTWORTET_NICHT“. Das Musterprojekt liest die Quittung nicht; die Wirkung zeigt kodi_event."

