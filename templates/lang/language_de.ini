; Kodi NG - Deutsch
;
; Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt selbst keine:
; parse_ini_file schneidet einen Wert am zweiten Anfuehrungszeichen ab.
; Attribute in der Auszeichnung sind deshalb einfach quotiert.
;
; Die Werte werden roh ausgegeben, nicht ueber ko_e() - die Auszeichnung soll
; wirken. Umlaute stehen als echte UTF-8-Zeichen, nicht als Entitaeten.
;
; %s, %n und %t sind Platzhalter, die die Oberflaeche einsetzt.

