A_FERN_AUS = "<b>nein.</b> In %s steht kein <span class='sm-mono'>&lt;webserver&gt;true&lt;/webserver&gt;</span>. Solange das so ist, antwortet weder die Weboberfläche noch JSON-RPC. Ein erneutes Installieren des Plugins legt die Datei wieder an (die vorhandene wird dabei als <span class='sm-mono'>.kodiplugin</span> gesichert)."
A_FERN_KEINE_DATEI = "<b>nein — es gibt gar keine <span class='sm-mono'>advancedsettings.xml</span>.</b> Das Plugin legt sie beim Einspielen an; fehlt sie, ist das Einspielen an dieser Stelle misslungen oder jemand hat sie entfernt. Ohne sie antwortet weder die Weboberfläche noch JSON-RPC. Hilft: das Plugin noch einmal installieren."
