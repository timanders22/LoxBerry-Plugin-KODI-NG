[BAUSTEIN]
VORTEXT = "Drei Seiten aus dem LoxBerry-Plugins Musterprojekt, jede Zeile ein Baustein (Baustein-Suche in Loxone Config: Taste <b>F5</b>). Die erste zeigt, ob Kodi läuft und ob das Plugin sich meldet, und meldet Ausfälle – sie genügt für den Anfang. Die zweite legt die Menütasten einer Fernbedienung in die App, die dritte Wiedergabe und Ton samt Automatiken (Pause bei der Türklingel, Stopp beim Verlassen des Hauses, Anschluss für das Licht beim Filmstart). Die Eingänge sind Virtuelle Eingänge mit dem Namen, den das MQTT-Gateway vergibt (Schritt 2); die Befehle hängen am Virtuellen Ausgang %s und gehen über MQTT an das Plugin (Schritt 3)."
