A_DIENST_NACH_NEUSTART = "nein — aber der <b>Autostart ist ein</b>, Kodi startet also beim nächsten Neustart von selbst. Das ist der Zustand unmittelbar nach dem Einspielen: das Plugin startet den Dienst <b>mit Absicht nicht</b> sofort, weil die Gruppenrechte für Ton, Bild und Eingabegeräte und die GPU-Einstellung in der <span class='sm-mono'>config.txt</span> erst nach einem Neustart greifen. Deshalb fragt LoxBerry nach der Installation danach. Wer nicht neu starten will, startet ihn im Abschnitt <i>Löst etwas aus</i> — dann fehlen bis zum nächsten Neustart allerdings genau jene Rechte."
