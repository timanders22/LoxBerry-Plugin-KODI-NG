TEXTTHEMEN = "Textthemen kommen als Virtueller Texteingang an, Name wie in der Spalte <i>Name im Gateway</i>. Das Kodi-Addon führt sein eigenes Thema, das unten steht; in der Vorgabe ist es dasselbe."
SENDER_AUS = "<b>Der Statussender ist ausgeschaltet.</b> Die %d Themen des Plugins werden deshalb nicht gesendet, und die Virtuellen Eingänge bleiben leer. Einschalten im Reiter MQTT."
K_VORLAGE_VO = "Vorlage der Steuerbefehle erzeugen"
STEUERN_TEXT = "Umgekehrt — also Loxone steuert Kodi — geht über Kodis TCP-Schnittstelle. Der Miniserver spricht dabei <b>unmittelbar</b> mit Kodi, nicht über den LoxBerry; der Ordnername des Plugins kommt in keiner Loxone-Adresse vor. Ein virtueller Ausgang mit dieser Adresse genügt:"
VORLAGE_HINWEIS = "Der Knopf erzeugt genau diesen Ausgang mit allen %d Befehlen und der oben stehenden Adresse. Die früher zusätzlich mitgelieferte Datei <span class='sm-mono'>data/VO_Kodi_V1.xml</span> ist seit 1.2.0 <b>entfallen</b>: sie war ein zweiter Stand desselben Inhalts, blieb gegenüber dem Erzeuger zurück und trug statt Ihrer Adresse den Platzhalter <span class='sm-mono'>loxberry</span>."
S1 = "Schritt 1: Werte über das MQTT-Gateway"
S2 = "Schritt 2: Virtuelle Eingänge anlegen"
S3 = "Schritt 3: Befehle über MQTT"
S3_TEXT = "Die 26 Befehle gehen als <i>publish</i> an den UDP-Eingang des MQTT-Gateways; die Befehlsbrücke des Plugins abonniert %s und gibt jeden Befehl an Kodi weiter. Im Musterprojekt hängen sie am Virtuellen Ausgang „LoxBerry MQTT-Gateway“."
S4 = "Bestehende Anlagen und Fremdsysteme: Befehle direkt an Kodi (TCP 9090)"
S5 = "Schritt 4: Ausfallerkennung"
S5_TEXT = "Ein virtueller Eingang behält seinen letzten Wert, wenn nichts mehr kommt — in der App sieht dann alles normal aus. Drei Themen sind dagegen da: %s zählt jede Minute eins weiter (0 bis 999, läuft um), und %s trägt die Zeit in Unix-Sekunden; beide werden <b>nie</b> zurückbehalten — bleibt der Zähler stehen, ist der Statussender oder der Weg zum Miniserver ausgefallen (im Musterprojekt: Analogwertvalidierung mit Max 999 und 300 s). %s ist 1, wenn der letzte Lauf wirklich gemessen hat, und 0, wenn der Helfer schwieg — auch dieser Wert wird nie zurückbehalten. Die bisherigen Themen <span class='sm-mono'>zeitstempel</span> und <span class='sm-mono'>herzschlag</span> gehen für bestehende Anlagen weiter hinaus."
S6 = "Schritt 5: Drei komplette Baustein-Listen zum Nachbauen"
S7 = "Schritt 6: Gegenprobe"
S7_TEXT = "Im MQTT-Gateway unter <i>Incoming overview</i> bzw. im MQTT Finder nachsehen, ob unter %s etwas ankommt. Dann in Loxone Config den Eingang %s ansehen: er muss sich jede Minute ändern. <b>Erst dann</b> die Bausteine verdrahten — wer bei einem stummen Eingang mit dem Verdrahten anfängt, sucht den Fehler hinterher in der Logik statt in der Verbindung. Kommt im Gateway nichts an, zuerst im Reiter Test die Zeile <i>Sendet der Statussender?</i> lesen."
TH_RETAIN = "retained"
ADRESSE_PRUEFEN = "Die Adresse ist ein Vorschlag: sie stammt aus der Konfiguration oder aus der Adresse, unter der Sie diese Seite sehen. Bitte prüfen, ob der Miniserver Kodi unter diesem Namen erreicht."
BILD_ALT = "Bausteine des Plugins in Loxone Config – Seite „%s“"
BILD_UNTERSCHRIFT = "Seite „%s“ im LoxBerry-Plugins Musterprojekt. Config kürzt lange Bausteinnamen – Namen siehe Tabelle."
MUSTERPROJEKT = "Die ganze Projektdatei mit allen Plugin-Seiten und Vorlagen: <a href='https://github.com/timanders22/LoxBerry-Plugins-Musterprojekt' target='_blank' rel='noopener'>LoxBerry-Plugins Musterprojekt</a>"
BL_ZUSTAND = "Zustand und Meldungen"
BL_FERN = "Fernbedienung"
BL_WIEDERGABE = "Wiedergabe und Automatik"
S0 = "Das Musterprojekt holt Werte über MQTT und sendet Befehle über MQTT an das Plugin. Der direkte Weg tcp://…:9090 steht unten für bestehende Anlagen und Fremdsysteme."
S1_SENDER = "Den <b>Statussender</b> im Reiter MQTT einschalten – bei einer Neuinstallation ist er ab Werk an, sobald die Einstellungen einmal gespeichert sind; ein Update ändert den gespeicherten Wert nicht. Ohne ihn kommt kein Lebenszeichen, und die Eingänge des Musterprojekts bleiben leer."
S1_V2_LISTE = "<b>Gateway V2:</b> in den <i>Subscriptions</i> diese Datenpunkte anhaken, bei „Haken + Noncached“ auch das Kästchen <i>Noncached</i> – der Wert kommt mit gleichem Inhalt wieder und muss trotzdem durch. Unter Gateway V1 ist nichts anzuhaken."
S1_RECONNECT = "Nach einem Neustart des Miniservers holt der zentrale <i>reconnect</i> auf der Seite „LoxBerry MQTT-Gateway“ des Musterprojekts die zurückbehaltenen Werte (dienst, autostart, Titel) neu."
S2_TEXT = "Je Wert einen <b>Virtuellen Eingang</b> (Peripherie → Virtuelle Eingänge) mit genau diesem Namen anlegen – das MQTT-Gateway liefert unter diesem Namen. „Als Digitaleingang“ nicht anhaken. Texte (Ereignis, Titel, Bildschirmschoner) als <b>Virtueller Texteingang</b>. Eine Importvorlage für die Eingänge gibt es seit 1.2.22 nicht mehr: sie legte HTTP-Eingänge an, die nie abgefragt werden."
S2_RECHTE = "Der Benutzer, mit dem das MQTT-Gateway am Miniserver anmeldet, braucht Rechte auf die Virtuellen Eingänge – sonst bleiben sie leer."
S2_PRAEFIX = "Wer im Reiter MQTT ein anderes Präfix einträgt, bekommt andere Namen – dann alle Eingänge neu benennen."
S3_HAKEN_AUS = "<b>Der Haken „Befehle über MQTT annehmen“ ist aus</b> (Reiter MQTT) – das Plugin lehnt jeden Befehl ab („abgelehnt: ausgeschaltet“)."
S3_STEUERN_AUS = "„Kodi: beenden“ wirkt erst mit dem zweiten Haken „Eingreifende Befehle über MQTT zulassen“ (Reiter MQTT); alle übrigen Befehle wirken schon."
S3_PRAEFIX = "Das Präfix %s enthält einen Punkt – für Befehle über MQTT ist es nicht zulässig. Im Reiter MQTT ein Präfix ohne Punkt eintragen."
K_VORLAGE_MQTT = "Vorlage MQTT-Befehle erzeugen"
S3_VORLAGE = "Die Vorlage legt einen eigenen Virtuellen Ausgang „Kodi Befehle (MQTT)“ mit allen %d Befehlen an, Adresse %s. Wer den Ausgang „LoxBerry MQTT-Gateway“ des Musterprojekts schon hat, legt die Befehle stattdessen dort an (Befehl bei EIN wie in der Tabelle). Loxone Config legt beim Import neu an und überschreibt nichts."
S3_NICHTS = "Für Befehle ist unter Gateway V1 und V2 nichts einzutragen."
S4_MUSTER = "Das Musterprojekt braucht diesen Weg nicht. Wer umgestiegen ist, schaltet „Kodis Fernsteuerung aus dem Heimnetz zulassen“ aus."
L_NETZ = "Kodis Fernsteuerung aus dem Heimnetz zulassen (tcp://…:9090, EventServer)"
H_NETZ = "Ab Werk an (wie bisher). Aus: Kodi nimmt JSON-RPC auf TCP 9090 und den EventServer auf UDP 9777 nur noch vom LoxBerry selbst an – Befehle über MQTT wirken weiter, Handy-Apps wie Kore oder Yatse aus dem Netz nicht mehr (nicht gemessen). Wirkt erst nach einem Neustart von Kodi (Reiter Einstellungen). Ein Update behält die Einstellung."
M_NETZ_AUF = "Kodis Fernsteuerung aus dem Heimnetz ist in der advancedsettings.xml eingeschaltet. Sie wirkt nach dem nächsten Start von Kodi (Reiter Einstellungen: Kodi neu starten)."
M_NETZ_ZU = "Kodis Fernsteuerung aus dem Heimnetz ist in der advancedsettings.xml ausgeschaltet. Das wirkt nach dem nächsten Start von Kodi (Reiter Einstellungen: Kodi neu starten); Befehle über MQTT wirken weiter."
M_NETZ_FEHL = "Gespeichert, aber die advancedsettings.xml wurde nicht geändert – der Helfer meldet: %s. Beim nächsten Einspielen des Plugins setzt die Installation den Wert aus der Konfiguration."
