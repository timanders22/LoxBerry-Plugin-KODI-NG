A_KODIPAKET_NEIN = "<b>nein.</b> %s fehlt, und dpkg kennt kein installiertes Paket <span class='sm-mono'>kodi</span>. Kodi wird normalerweise <b>mit dem Plugin</b> eingespielt — LoxBerry liest dazu <span class='sm-mono'>dpkg/apt</span>. Ist das misslungen (kein Netz, Platte voll), hilft ein erneutes Installieren des Plugins; von Hand: <span class='sm-mono'>sudo apt-get install kodi</span>. Der Dienst kann bis dahin nicht starten."
